<script>
"use strict";
const deck={"fps": 30, "frames": 16351, "sections": [{"name": "A packet vanishes", "frame": 0, "type": "default.normal", "notes": "A packet disappears, and the sender hears nothing. Was the message lost, or just the reply? That uncertainty is enough to cause duplicates, endless waiting, or missing data. Let's build a way out.", "id": "03-01", "chapter": "The puzzle", "animation_end_frame": 660}, {"name": "Read the timeline", "frame": 682, "type": "default.normal", "notes": "Read this picture as a timeline. The sender is on the left, the receiver on the right, and time moves downward. Sloping arrows cross the distance; returning arrows carry acknowledgments, small messages that report progress.", "id": "03-02", "chapter": "The model", "animation_end_frame": 1330}, {"name": "Send one, then wait", "frame": 1352, "type": "default.normal", "notes": "Start with the simplest rule: send one packet, keep a copy, and wait for confirmation before sending another. This is stop-and-wait. Keeping the copy gives the sender something to use if the attempt fails.", "id": "03-03", "chapter": "Stop-and-wait", "animation_end_frame": 2012}, {"name": "Choose an ACK convention", "frame": 2034, "type": "default.normal", "notes": "We need one precise convention. An ACK names the next packet expected. ACK one confirms packet zero; ACK four confirms zero through three. That number points to the first missing position in the ordered sequence.", "id": "03-04", "chapter": "Stop-and-wait", "animation_end_frame": 2694}, {"name": "Notice the idle gap", "frame": 2716, "type": "default.normal", "notes": "Notice the empty space after transmission. The packet is still travelling, and its acknowledgment must travel back. The sender could have more data ready, yet our rule leaves it idle until that round trip finishes.", "id": "03-05", "chapter": "Stop-and-wait", "animation_end_frame": 3364}, {"name": "Separate two kinds of time", "frame": 3386, "type": "default.normal", "notes": "Two delays explain this gap. Transmission time measures putting the bits onto the link; propagation time measures their travel. A faster transmitter reduces one delay without making the signal itself cross the distance instantly.", "id": "03-06", "chapter": "Stop-and-wait", "animation_end_frame": 4058}, {"name": "Calculate stop-and-wait use", "frame": 4081, "type": "default.normal", "notes": "Here, transmission takes one millisecond and round-trip propagation takes twenty. Ignoring other overhead, only one millisecond in twenty-one is spent sending useful data: about four point eight percent. The waiting dominates the work.", "id": "03-07", "chapter": "Worked example", "animation_end_frame": 4740}, {"name": "Lose the data packet", "frame": 4763, "type": "default.normal", "notes": "Now lose the packet. No acknowledgment returns, but silence doesn't reveal the cause. The data might be missing, its acknowledgment might be missing, or either could simply be late. Waiting forever cannot resolve that uncertainty.", "id": "03-08", "chapter": "Failure and recovery", "animation_end_frame": 5424}, {"name": "Expire a timer", "frame": 5446, "type": "default.normal", "notes": "A timer gives the sender a decision point. When enough time passes without confirmation, recovery begins. Notice what it hasn't established: a timeout is a reason to retry, not proof that the original packet vanished.", "id": "03-09", "chapter": "Failure and recovery", "animation_end_frame": 6106}, {"name": "Retransmit the saved copy", "frame": 6128, "type": "default.normal", "notes": "The saved copy is sent again with the same sequence number. This attempt reaches the receiver, and ACK one returns. With progress confirmed, the sender can release that copy and prepare the next packet.", "id": "03-10", "chapter": "Failure and recovery", "animation_end_frame": 6774}, {"name": "Lose the acknowledgment instead", "frame": 6797, "type": "default.normal", "notes": "Change just one event: deliver the data, but lose its acknowledgment. The sender sees the same silence and retries. Now a perfectly reasonable recovery creates a second arrival. How can the receiver avoid delivering the contents twice?", "id": "03-11", "chapter": "Failure and recovery", "animation_end_frame": 7432}, {"name": "Recognize the duplicate", "frame": 7454, "type": "default.normal", "notes": "The sequence number answers that question. The receiver expects one, so another zero is a duplicate. It repeats ACK one without delivering the data again. Repeating transmission doesn't have to mean repeating delivery to the application.", "id": "03-12", "chapter": "Failure and recovery", "animation_end_frame": 8114}, {"name": "Why alternating bits can work", "frame": 8136, "type": "default.normal", "notes": "For basic stop-and-wait, alternating zero and one can distinguish successive packets under suitable initialization and old-duplicate assumptions. Our larger numbers make the examples easier to track, but sequence information needn't always be a large counter.", "id": "03-13", "chapter": "Failure and recovery", "animation_end_frame": 8810}, {"name": "Choose a sensible timeout", "frame": 8832, "type": "default.normal", "notes": "Set the timer too short and late packets trigger unnecessary retries. Set it too long and actual losses cause long stalls. This delayed acknowledgment exposes the balance. Real protocols can estimate delays and adapt their timers.", "id": "03-14", "chapter": "Failure and recovery", "animation_end_frame": 9504}, {"name": "Allow four packets in flight", "frame": 9527, "type": "default.normal", "notes": "Can we use the waiting time? Allow four unconfirmed packets instead of one. The sending window limits how much data may be outstanding. It changes the sender's permission to proceed, without adding another physical link.", "id": "03-15", "chapter": "Sliding windows", "animation_end_frame": 10200}, {"name": "Fill the pipeline", "frame": 10222, "type": "default.normal", "notes": "Now zero, one, two, and three follow each other into the network. Earlier packets travel while later ones leave, and acknowledgments return behind them. The same link carries more useful work because we stopped waiting after every packet.", "id": "03-16", "chapter": "Sliding windows", "animation_end_frame": 10882}, {"name": "Use cumulative acknowledgments", "frame": 10904, "type": "default.normal", "notes": "ACK three confirms the complete run through packet two. That's cumulative acknowledgment: one reply can report progress across several packets. The boundary can advance only through consecutive received data, leaving a gap as the stopping point.", "id": "03-17", "chapter": "Sliding windows", "animation_end_frame": 11538}, {"name": "Slide the sending window", "frame": 11561, "type": "default.normal", "notes": "In this separate example, ACK two confirms zero and one. The window moves forward two positions, allowing new packets at its far edge. Follow the boundary: the allowed range moves, while its size stays four.", "id": "03-18", "chapter": "Sliding windows", "animation_end_frame": 12220}, {"name": "Go-Back-N: lose packet 1", "frame": 12243, "type": "default.normal", "notes": "Now lose packet one after sending zero through three. Zero arrives, so the receiver asks for one. We pause new sends here to isolate the problem: the sender still lacks confirmation for one, two, and three.", "id": "03-19", "chapter": "Go-Back-N example", "animation_end_frame": 12916}, {"name": "Discard later arrivals", "frame": 12938, "type": "default.normal", "notes": "Our basic Go-Back-N receiver discards two and three because one is missing. Each later arrival prompts ACK one again. Those packets reached the destination, but this protocol hasn't accepted them into the ordered sequence.", "id": "03-20", "chapter": "Go-Back-N example", "animation_end_frame": 13572}, {"name": "Retransmit from the gap", "frame": 13595, "type": "default.normal", "notes": "When packet one's timer expires, the sender retries one, two, and three. Zero remains confirmed. This explains Go-Back-N's extra work after a loss: recovery repeats the outstanding sequence starting at the gap.", "id": "03-21", "chapter": "Go-Back-N example", "animation_end_frame": 14280}, {"name": "Accept the repaired sequence", "frame": 14303, "type": "default.normal", "notes": "The repeated packets now arrive in order. ACK four advances the boundary past three, releasing the saved copies. The number still means the next packet wanted. Our convention stays consistent through both failure and recovery.", "id": "03-22", "chapter": "Go-Back-N example", "animation_end_frame": 14962}, {"name": "Compare the mechanisms carefully", "frame": 14985, "type": "default.normal", "notes": "Compare windows of one, four, and twenty-one. More outstanding packets can fill the waiting time, but can't exceed the link's capacity. TCP uses related ideas with byte numbers and additional mechanisms beyond this simplified packet model.", "id": "03-23", "chapter": "Comparison", "animation_end_frame": 15633}, {"name": "Reconstruct reliability yourself", "frame": 15655, "type": "default.normal", "notes": "Reliability emerged from a few pieces working together: confirmations, saved copies, timers, sequence numbers, and a moving window. Each solves a different failure. Together, they let communication recover when the path can eventually carry data.", "id": "03-24", "chapter": "Recap", "animation_end_frame": 16328}], "captions": [[0.0, 7.577777777777778, "A packet disappears, and the sender hears\nnothing. Was the message"], [7.577777777777778, 15.155555555555557, "lost, or just the reply? That uncertainty is\nenough to cause"], [15.155555555555557, 22.733333333333334, "duplicates, endless waiting, or missing data.\nLet's build a way out."], [22.733333333333334, 28.31666666666667, "Read this picture as a timeline. The sender is\non the"], [28.31666666666667, 33.900000000000006, "left, the receiver on the right, and time\nmoves downward. Sloping"], [33.900000000000 const $=id=>document.getElementById(id),film=$('film'),all=deck.sections,fps=deck.fps;
let current=0,state='ready',loaded=false,generation=0,presenter=null,started=false;
const start=i=>all[i].frame/fps;
const finish=i=>((i+1<all.length?all[i+1].frame:deck.frames)-0.5)/fps;
const motionFinish=i=>Math.min(finish(i),(all[i].animation_end_frame??((i+1<all.length?all[i+1].frame:deck.frames)-1))/fps);
const track=film.addTextTrack('captions','Guide captions','en');
for(const [a,b,t] of deck.captions)track.addCue(new VTTCue(a,b,t));
track.mode='hidden';
function sync(){
  const speed=`${film.playbackRate}×`;
  document.title=`${deck.title} · ${current+1}/${all.length} · ${speed}`;
  $('status').textContent=`Scene ${current+1} of ${all.length}: ${all[current].name}. ${state}. Speed ${speed}.`;
  if(presenter&&!presenter.closed){
    const d=presenter.document;
    d.getElementById('section').textContent=`${current+1} / ${all.length} — ${all[current].name}`;
    d.getElementById('script').textContent=all[current].notes;
    d.getElementById('speed').textContent=`Speed: ${speed}`;
    d.getElementById('scenes').value=current;
    d.getElementById('upnext').textContent=current+1<all.length?`Up next: ${all[current+1].name}`:'Final scene';
    const v=d.getElementById('preview');
    if(v.readyState>=1)v.currentTime=Math.min(film.currentTime,finish(current));
  }
}
function choose(i){if(!loaded)return;generation++;film.pause();current=Math.max(0,Math.min(i,all.length-1));state='ready';film.currentTime=finish(current);sync()}
function hold(){if(state!=='playing')return;generation++;film.pause();state='held';film.currentTime=finish(current);sync()}
function check(time){if(state==='playing'&&time>=motionFinish(current)-1/fps)hold()}
function watch(token){if(!film.requestVideoFrameCallback)return;film.requestVideoFrameCallback((_,meta)=>{if(token!==generation||state!=='playing')return;check(meta.mediaTime);if(state==='playing')watch(token)})}
async function run(restart=true){
  if(!loaded)return;
  const token=++generation;
  if(restart)film.currentTime=start(current)+0.5/fps;
  started=true;$('error').hidden=true;state='playing';sync();
  try{await film.play();if(token===generation)watch(token)}catch(e){if(token===generation){state='paused';sync();$('error').hidden=false;$('error').textContent=`Playback could not start: ${e.message}. Press P to retry.`}}
}
function next(){if(!loaded)return;if(!started&&!document.fullscreenElement)fullscreen();if(state!=='ready'){if(current===all.length-1)return;current++}run()}
function pause(){if(state==='playing'){generation++;film.pause();state='paused';sync()}else if(state==='paused')run(false)}
function fullscreen(){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else if($('app').requestFullscreen)$('app').requestFullscreen().catch(()=>{})}
function speed(delta){film.playbackRate=Math.max(.25,Math.min(4,Math.round((film.playbackRate+delta)*4)/4));sync()}
function openPresenter(){
  presenter=window.open('','networks-presenter','width=900,height=760');
  if(!presenter){$('status').textContent='Allow the presenter popup to read the script.';return}
  const d=presenter.document;d.title='Presenter notes — '+deck.title;d.body.replaceChildren();
  const style=d.createElement('style');style.textContent='body{background:#07111f;color:#edf4ff;font:22px/1.65 system-ui;padding:24px}h1{font-size:24px;color:#64d8eb}video{width:100%;max-height:230px;object-fit:contain}p{white-space:pre-wrap}button,select{padding:12px;margin:4px;background:#17334b;color:white;border:1px solid #456;border-radius:8px;font-size:18px}small{color:#9bb3ce}';d.head.append(style);
  const h=d.createElement('h1');h.id='section';d.body.append(h);
  const v=d.createElement('video');v.id='preview';v.src=film.currentSrc||film.src;v.muted=true;d.body.append(v);
  const n=d.createElement('p');n.id='script';d.body.append(n);
  const rate=d.createElement('p');rate.id='speed';d.body.append(rate);
  for(const [text,action] of [['← Previous',()=>choose(current-1)],['Replay',()=>run()],['Pause / Resume',pause],['Next →',next],['Slower ↓',()=>speed(-.25)],['Faster ↑',()=>speed(.25)]]){const b=d.createElement('button');b.textContent=text;b.onclick=action;d.body.append(b)}
  const select=d.createElement('select');select.id='scenes';select.setAttribute('aria-label','Choose scene');
  all.forEach((s,i)=>{const o=d.createElement('option');o.value=i;o.textContent=`${i+1}. ${s.name}`;select.append(o)});
  select.onchange=()=>choose(Number(select.value));d.body.append(select);
  const up=d.createElement('p');up.id='upnext';d.body.append(up);
  const small=d.createElement('small');small.textContent='Main window: video only. → next · ← previous · ↑/↓ speed (0.25× to 4×) · P pause · R replay · F fullscreen · C captions. Speed also appears in the main browser tab title.';d.body.append(small);
  d.addEventListener('keydown',key);v.addEventListener('loadedmetadata',sync,{once:true});sync();
}
function key(e){
  if(e.repeat||['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName))return;
  if(e.target.tagName==='BUTTON'&&[' ','Enter'].includes(e.key))return;
  if(e.shiftKey&&e.key.toLowerCase()==='p'){e.preventDefault();openPresenter();return}
  const actions={' ':next,Enter:next,ArrowRight:next,PageDown:next,ArrowLeft:()=>choose(current-1),PageUp:()=>choose(current-1),ArrowUp:()=>speed(.25),ArrowDown:()=>speed(-.25),r:()=>run(),p:pause,f:fullscreen,c:()=>{track.mode=track.mode==='showing'?'hidden':'showing'},Home:()=>choose(0),End:()=>choose(all.length-1)};
  const action=actions[e.key]||actions[e.key.toLowerCase()];if(action){e.preventDefault();action()}
}
film.onclick=next;
film.addEventListener('loadeddata',()=>{loaded=true;choose(0)},{once:true});
film.addEventListener('timeupdate',()=>check(film.currentTime));film.addEventListener('ended',hold);
film.addEventListener('ratechange',sync);
film.addEventListener('error',()=>{$('error').hidden=false;$('error').textContent='Cannot load episode.mp4. Keep it beside presentation.html, or open this lesson using the local server link in the README.'});
document.addEventListener('keydown',key);sync();
window.lessonState=()=>({current,state,loaded,time:film.currentTime,start:start(current),end:finish(current),motionEnd:motionFinish(current),count:all.length,speed:film.playbackRate});
</script></body></html>
