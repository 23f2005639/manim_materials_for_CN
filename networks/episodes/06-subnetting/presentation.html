"use strict";
const deck={"fps": 30, "frames": 15001, "sections": [{"name": "One network, four smaller networks", "frame": 0, "type": "default.normal", "notes": "This block contains 256 addresses. We want four separate networks, with no gaps and no overlap. How can a few extra bits create all four boundaries? Watch what happens when we move one dividing line.", "id": "06-01", "chapter": "The subnetting puzzle", "animation_end_frame": 621}, {"name": "IPv4 addresses contain thirty-two bits", "frame": 649, "type": "default.normal", "notes": "An IPv4 address contains thirty-two bits, displayed as four decimal octets. Each octet represents eight bits. The familiar dotted form makes the number readable, but the block structure becomes much clearer when we expose the bits underneath.", "id": "06-02", "chapter": "The binary model", "animation_end_frame": 1230}, {"name": "A prefix marks the shared beginning", "frame": 1259, "type": "default.normal", "notes": "Slash twenty-four fixes the first twenty-four positions. The last eight may vary, so every address in this block shares the same beginning. A prefix describes that common part and tells us which remaining combinations belong together.", "id": "06-03", "chapter": "The binary model", "animation_end_frame": 1878}, {"name": "The mask expresses the boundary", "frame": 1907, "type": "default.normal", "notes": "A mask makes this boundary explicit: ones mark the fixed prefix positions; zeros mark the changing positions. For slash twenty-four, the mask is 255.255.255.0. The decimal form is simply another view of those thirty-two bits.", "id": "06-04", "chapter": "The binary model", "animation_end_frame": 2476}, {"name": "Find the network with bitwise AND", "frame": 2504, "type": "default.normal", "notes": "To extract the network, apply bitwise AND. A mask one keeps the address bit; a zero clears it. Applying this mask to 192.168.1.42 leaves 192.168.1.0. The variable part disappears, exposing the common prefix.", "id": "06-05", "chapter": "The binary model", "animation_end_frame": 3124}, {"name": "Count the parent block", "frame": 3153, "type": "default.normal", "notes": "Eight variable bits allow two to the power of eight combinations: 256 addresses. In the last octet, that's zero through 255. This counts every address in the block, before assigning any special network or broadcast roles.", "id": "06-06", "chapter": "The binary model", "animation_end_frame": 3708}, {"name": "Borrow two bits for four subnets", "frame": 3737, "type": "default.normal", "notes": "Fix one more bit and the possibilities split in half. Fix a second and each half splits again. Four subnets require two extra prefix bits, moving our boundary from slash twenty-four to slash twenty-six.", "id": "06-07", "chapter": "Divide the block", "animation_end_frame": 4306}, {"name": "Build the slash-twenty-six mask", "frame": 4334, "type": "default.normal", "notes": "The last octet of the new mask begins with two ones. Their values are 128 and sixty-four, totaling 192. Six zeros follow. That's why the complete slash-twenty-six mask becomes 255.255.255.192, rather than an arbitrary number to memorize.", "id": "06-08", "chapter": "Divide the block", "animation_end_frame": 4916}, {"name": "Six host bits make sixty-four addresses", "frame": 4944, "type": "default.normal", "notes": "Six bits remain free inside each subnet. They produce sixty-four addresses. Four times sixty-four gives the original 256, which is a useful consistency check: moving the boundary divides the existing space without changing its total size.", "id": "06-09", "chapter": "Divide the block", "animation_end_frame": 5526}, {"name": "The four binary prefixes", "frame": 5554, "type": "default.normal", "notes": "The two new subnet bits can be zero-zero, zero-one, one-zero, or one-one. With all host bits cleared, those prefixes begin at zero, sixty-four, 128, and 192. Four binary choices create four evenly spaced boundaries.", "id": "06-10", "chapter": "Divide the block", "animation_end_frame": 6161}, {"name": "Subnet one: zero through sixty-three", "frame": 6189, "type": "default.normal", "notes": "The first subnet covers last-octet values zero through sixty-three. On an ordinary LAN, zero identifies the network and sixty-three is broadcast. Hosts use one through sixty-two: sixty-two usable addresses within a sixty-four-address block.", "id": "06-11", "chapter": "Read each subnet", "animation_end_frame": 6758}, {"name": "Subnet two: sixty-four through 127", "frame": 6786, "type": "default.normal", "notes": "The second subnet starts at sixty-four and ends at 127. Hosts occupy sixty-five through 126. Notice the broadcast ends in 127 here. Its identity comes from all host bits being one, not from always ending in 255.", "id": "06-12", "chapter": "Read each subnet", "animation_end_frame": 7407}, {"name": "Subnet three: 128 through 191", "frame": 7435, "type": "default.normal", "notes": "The third prefix begins at 128 and covers through 191. Its ordinary host range is 129 through 190. The calculation hasn't changed; the fixed subnet bits have moved us into the next group of sixty-four combinations.", "id": "06-13", "chapter": "Read each subnet", "animation_end_frame": 8030}, {"name": "Subnet four: 192 through 255", "frame": 8058, "type": "default.normal", "notes": "The fourth block runs from 192 through 255, with hosts from 193 through 254. Together, the four ranges cover the parent exactly once. Their boundaries meet cleanly, and each address belongs to just one subnet.", "id": "06-14", "chapter": "Read each subnet", "animation_end_frame": 8640}, {"name": "Locate the host ending in seventy", "frame": 8668, "type": "default.normal", "notes": "Where does seventy fit? Its binary last octet is 01000110. AND with 11000000 leaves 01000000: sixty-four. So 192.168.1.70 lies in 192.168.1.64 slash twenty-six. The mask finds the block directly, without searching a table.", "id": "06-15", "chapter": "Apply the calculation", "animation_end_frame": 9198}, {"name": "Same prefix or a different subnet?", "frame": 9226, "type": "default.normal", "notes": "Seventy and one hundred share that sixty-four prefix. Address 130 belongs to the block starting at 128. Similar decimal addresses can cross a subnet boundary; masking both addresses reveals whether their network portions actually match.", "id": "06-16", "chapter": "Apply the calculation", "animation_end_frame": 9820}, {"name": "Remote destinations use a router", "frame": 9849, "type": "default.normal", "notes": "That boundary affects delivery. A host normally reaches a destination in its own subnet locally; another subnet needs a suitable next-hop router. This is a logical addressing decision, independent of whether the devices occupy different physical rooms.", "id": "06-17", "chapter": "Apply the calculation", "animation_end_frame": 10468}, {"name": "Choose a prefix for fifty hosts", "frame": 10497, "type": "default.normal", "notes": "Suppose the network needs fifty host addresses. Slash twenty-seven offers thirty usable addresses on an ordinary LAN, which isn't enough. Slash twenty-six offers sixty-two. Work backward from the required capacity to choose the smallest suitable block.", "id": "06-18", "chapter": "Apply the calculation", "animation_end_frame": 11105}, {"name": "More prefix bits, fewer addresses", "frame": 11133, "type": "default.normal", "notes": "Every extra fixed prefix bit halves the remaining combinations. Slash twenty-five gives 128 total addresses, slash twenty-six sixty-four, slash twenty-seven thirty-two. Longer prefixes mean smaller blocks because fewer positions remain free to change.", "id": "06-19", "chapter": "Reason about the boundary", "animation_end_frame": 11754}, {"name": "The subtract-two rule has exceptions", "frame": 11782, "type": "default.normal", "notes": "Subtracting two is useful for ordinary LAN subnets, but isn't universal. Suitable slash-thirty-one point-to-point links can use both addresses; slash thirty-two identifies a single address. The address roles depend on the network's purpose and prefix.", "id": "06-20", "chapter": "Reason about the boundary", "animation_end_frame": 12376}, {"name": "A subnet is not a security policy", "frame": 12405, "type": "default.normal", "notes": "A subnet boundary doesn't itself encrypt traffic or forbid crossing. Routing and access policies determine which communication is allowed. Splitting an address block organizes delivery; protection requires the relevant security mechanisms as well.", "id": "06-21", "chapter": "Common misconceptions", "animation_end_frame": 13038}, {"name": "CIDR replaces the classful shortcut", "frame": 13067, "type": "default.normal", "notes": "Modern classless addressing uses the supplied prefix, rather than guessing a class from the first octet. Also, our 192.168.1 block uses private addresses. It illustrates internal network organization, rather than a globally routable public block.", "id": "06-22", "chapter": "Common misconceptions", "animation_end_frame": 13700}, {"name": "Check all four answers", "frame": 13728, "type": "default.normal", "notes": "Check the four starts: zero, sixty-four, 128, 192. Each broadcast sits one below the next boundary, ending at 255 for the last block. Equal block sizes and clean boundaries let us verify the entire split together.", "id": "06-23", "chapter": "Worked-example verification", "animation_end_frame": 14296}, {"name": "Move the boundary, solve the puzzle", "frame": 14325, "type": "default.normal", "notes": "Two bits created four prefixes; six remaining bits created sixty-four addresses per prefix. Masks, ranges, and host counts all follow from that same boundary. Once you see the division, the separate-looking rules become consequences of one picture.", "id": "06-24", "chapter": "Recap", "animation_end_frame": 14972}], "captions": [[0.0, 5.408333333333333, "This block contains 256 addresses. We want\nfour separate networks, with"], [5.408333333333333, 10.816666666666666, "no gaps and n const $=id=>document.getElementById(id),film=$('film'),all=deck.sections,fps=deck.fps;
let current=0,state='ready',loaded=false,generation=0,presenter=null,started=false;
const start=i=>all[i].frame/fps;
const finish=i=>((i+1<all.length?all[i+1].frame:deck.frames)-0.5)/fps;
const motionFinish=i=>Math.min(finish(i),(all[i].animation_end_frame??((i+1<all.length?all[i+1].frame:deck.frames)-1))/fps);
const track=film.addTextTrack('captions','Guide captions','en');
for(const [a,b,t] of deck.captions)track.addCue(new VTTCue(a,b,t));
track.mode='hidden';
function sync(){
  const speed=`${film.playbackRate}×`;
  document.title=`${deck.title} · ${current+1}/${all.length} · ${speed}`;
  $('status').textContent=`Scene ${current+1} of ${all.length}: ${all[current].name}. ${state}. Speed ${speed}.`;
  if(presenter&&!presenter.closed){
    const d=presenter.document;
    d.getElementById('section').textContent=`${current+1} / ${all.length} — ${all[current].name}`;
    d.getElementById('script').textContent=all[current].notes;
    d.getElementById('speed').textContent=`Speed: ${speed}`;
    d.getElementById('scenes').value=current;
    d.getElementById('upnext').textContent=current+1<all.length?`Up next: ${all[current+1].name}`:'Final scene';
    const v=d.getElementById('preview');
    if(v.readyState>=1)v.currentTime=Math.min(film.currentTime,finish(current));
  }
}
function choose(i){if(!loaded)return;generation++;film.pause();current=Math.max(0,Math.min(i,all.length-1));state='ready';film.currentTime=finish(current);sync()}
function hold(){if(state!=='playing')return;generation++;film.pause();state='held';film.currentTime=finish(current);sync()}
function check(time){if(state==='playing'&&time>=motionFinish(current)-1/fps)hold()}
function watch(token){if(!film.requestVideoFrameCallback)return;film.requestVideoFrameCallback((_,meta)=>{if(token!==generation||state!=='playing')return;check(meta.mediaTime);if(state==='playing')watch(token)})}
async function run(restart=true){
  if(!loaded)return;
  const token=++generation;
  if(restart)film.currentTime=start(current)+0.5/fps;
  started=true;$('error').hidden=true;state='playing';sync();
  try{await film.play();if(token===generation)watch(token)}catch(e){if(token===generation){state='paused';sync();$('error').hidden=false;$('error').textContent=`Playback could not start: ${e.message}. Press P to retry.`}}
}
function next(){if(!loaded)return;if(!started&&!document.fullscreenElement)fullscreen();if(state!=='ready'){if(current===all.length-1)return;current++}run()}
function pause(){if(state==='playing'){generation++;film.pause();state='paused';sync()}else if(state==='paused')run(false)}
function fullscreen(){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else if($('app').requestFullscreen)$('app').requestFullscreen().catch(()=>{})}
function speed(delta){film.playbackRate=Math.max(.25,Math.min(4,Math.round((film.playbackRate+delta)*4)/4));sync()}
function openPresenter(){
  presenter=window.open('','networks-presenter','width=900,height=760');
  if(!presenter){$('status').textContent='Allow the presenter popup to read the script.';return}
  const d=presenter.document;d.title='Presenter notes — '+deck.title;d.body.replaceChildren();
  const style=d.createElement('style');style.textContent='body{background:#07111f;color:#edf4ff;font:22px/1.65 system-ui;padding:24px}h1{font-size:24px;color:#64d8eb}video{width:100%;max-height:230px;object-fit:contain}p{white-space:pre-wrap}button,select{padding:12px;margin:4px;background:#17334b;color:white;border:1px solid #456;border-radius:8px;font-size:18px}small{color:#9bb3ce}';d.head.append(style);
  const h=d.createElement('h1');h.id='section';d.body.append(h);
  const v=d.createElement('video');v.id='preview';v.src=film.currentSrc||film.src;v.muted=true;d.body.append(v);
  const n=d.createElement('p');n.id='script';d.body.append(n);
  const rate=d.createElement('p');rate.id='speed';d.body.append(rate);
  for(const [text,action] of [['← Previous',()=>choose(current-1)],['Replay',()=>run()],['Pause / Resume',pause],['Next →',next],['Slower ↓',()=>speed(-.25)],['Faster ↑',()=>speed(.25)]]){const b=d.createElement('button');b.textContent=text;b.onclick=action;d.body.append(b)}

  d.addEventListener('keydown',key);v.addEventListener('loadedmetadata',sync,{once:true});sync();
}
function key(e){
  if(e.repeat||['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName))return;
  if(e.target.tagName==='BUTTON'&&[' ','Enter'].includes(e.key))return;
  if(e.shiftKey&&e.key.toLowerCase()==='p'){e.preventDefault();openPresenter();return}

  const action=actions[e.key]||actions[e.key.toLowerCase()];if(action){e.preventDefault();action()}
}
