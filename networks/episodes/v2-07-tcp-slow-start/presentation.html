<script>
"use strict";
const deck={"fps": 30, "frames": 17554, "sections": [{"name": "An unknown road ahead", "frame": 0, "type": "default.normal", "notes": "A download is ready to send millions of bytes. Somewhere ahead is a connection that limits how quickly they can pass, but the sender does not begin with a map of its available capacity. Sending everything immediately could overwhelm it. Sending painfully little forever wastes an opportunity. So how does a sender start? Watch the first packets and their returning acknowledgments. They will do more than confirm delivery: they will help pace a growing experiment called TCP slow start.", "id": "07-01", "chapter": "The puzzle", "animation_end_frame": 320}, {"name": "Separate the limits", "frame": 1110, "type": "default.normal", "notes": "Our picture has a sender, a receiver, and a bottleneck along the path. Assume the receiver has plenty of free buffer space, so its advertised window is not the limit in this story. We are focusing on the sender's congestion window, usually called cwnd. It bounds how many bytes may be outstanding without acknowledgment. That is a quantity of data, not a transmission speed printed on the cable. Keeping those two meanings separate will make the later equation much easier.", "id": "07-02", "chapter": "The puzzle", "animation_end_frame": 1215}, {"name": "Begin with a small window", "frame": 2233, "type": "default.normal", "notes": "For our illustration, begin with room for four full-size segments. Four is a teaching choice, not a claim that every TCP connection starts there. Initial-window choices have changed across specifications and implementations. We are also assuming one useful acknowledgment for each new segment and steady round-trip timing. These clean assumptions let us see the mechanism before real network variation blurs it. The sender has more data ready, but only these first four segments are allowed into the experiment.", "id": "07-03", "chapter": "The puzzle", "animation_end_frame": 2452}, {"name": "The first packets leave", "frame": 3329, "type": "default.normal", "notes": "One, two, three, four. The sender puts those segments onto the path, then waits for progress to be confirmed. At this point, there can be four segments of unacknowledged data in flight. They are not travelling on four new cables. They are sharing the same path at different positions. If the sender released its whole file just because the first segment had left its machine, it would be ignoring the very uncertainty slow start is trying to manage.", "id": "07-04", "chapter": "Build the mechanism", "animation_end_frame": 3644}, {"name": "An acknowledgment opens space", "frame": 4425, "type": "default.normal", "notes": "The first acknowledgment comes back. Part of its effect is straightforward: the confirmed data no longer counts as outstanding. There is now room to send a replacement segment within the old window. But slow start also increases the congestion window when new data is acknowledged, subject to its rules. In our simplified full-segment example, it adds one more segment of allowance. One acknowledgment therefore frees old space and helps create new space. That combination is what makes the next round grow.", "id": "07-05", "chapter": "Build the mechanism", "animation_end_frame": 4694}, {"name": "Four acknowledgments become eight", "frame": 5561, "type": "default.normal", "notes": "Repeat that process for the four initial segments. Each acknowledgment confirms progress and contributes one segment to our illustrative window growth. By the end of this round, cwnd has increased from four segments to eight. The sender can now have twice as much unacknowledged data outstanding. It did not ask a router for an exact bandwidth number. It used successful delivery feedback to expand cautiously from its starting point. The growth is emerging from the acknowledgment rule, not a stopwatch alone.", "id": "07-06", "chapter": "Build the mechanism", "animation_end_frame": 5870}, {"name": "The acknowledgment clock", "frame": 6697, "type": "default.normal", "notes": "Look closely at the returning arrows. Acknowledgments do not just arrive after an abstract round has finished; each one can permit new sending as it arrives. That is an ACK clock. The flow of feedback helps pace the outgoing flow of data. Our round-by-round grouping makes the count easier to follow, but a real sender does not have to wait for all acknowledgments in a batch before doing anything. It reacts as progress arrives.", "id": "07-07", "chapter": "Build the mechanism", "animation_end_frame": 7058}, {"name": "Why the growth doubles", "frame": 7740, "type": "default.normal", "notes": "After eight segments are acknowledged under our assumptions, the window grows by another eight, reaching sixteen. Then sixteen successful segment acknowledgments can take it to thirty-two. Why doubling? Start with W segments of allowance, add roughly W more over a round trip, and the next round has about two W. The exponential-looking graph is the accumulated result of many small increases. The name slow start sounds modest, but its early growth can become surprisingly quick across several rounds.", "id": "07-08", "chapter": "Build the mechanism", "animation_end_frame": 7929}, {"name": "Turn the pattern into math", "frame": 8836, "type": "default.normal", "notes": "We can now write the pattern instead of memorizing it. Starting from four, the idealized window after k complete growth rounds is four times two to the power k. Zero rounds gives four; one gives eight; two gives sixteen; three gives thirty-two. The equation describes the clean picture we just built. Delayed acknowledgments, different growth rules, losses, and application limits can change the actual trace. So use this model to understand the mechanism, rather than as a prediction for every download.", "id": "07-09", "chapter": "Build the mechanism", "animation_end_frame": 9145}, {"name": "A window is not a rate", "frame": 9972, "type": "default.normal", "notes": "Suppose each segment carries one thousand bytes, to keep the arithmetic visible. A sixteen-segment window holds sixteen thousand bytes of outstanding data. If that much data can be acknowledged every hundred milliseconds, the window supports an average of one hundred sixty thousand bytes per second. Multiply by eight and that is about one point two eight megabits per second. This is a window-limited approximation, not a promise that the path can deliver that rate.", "id": "07-10", "chapter": "Build the mechanism", "animation_end_frame": 10185}, {"name": "Distance changes the result", "frame": 11015, "type": "default.normal", "notes": "Keep the same sixteen thousand bytes, but double the round-trip time to two hundred milliseconds. The approximate rate halves, because replenishing the same allowance takes twice as long. Now the expression window divided by round-trip time has a visible meaning: an amount of outstanding data, renewed over a period of time. A larger window can help keep a longer path busy, but it cannot force more through a bottleneck than that connection can actually transmit.", "id": "07-11", "chapter": "Build the mechanism", "animation_end_frame": 11288}, {"name": "When the path cannot keep up", "frame": 12071, "type": "default.normal", "notes": "Our growing train eventually reaches a point where the bottleneck cannot serve arrivals as quickly as they build up. Packets wait, and the feedback reaches the sender later. Congestion may also lead to packet loss or explicit signals. Successful earlier rounds did not prove that unlimited growth would remain safe. They only justified increasing from the earlier operating point. Slow start explores available capacity through feedback; it does not receive advance permission to overfill every buffer on the path.", "id": "07-12", "chapter": "Test the idea", "animation_end_frame": 12533}, {"name": "Give exponential growth a boundary", "frame": 13181, "type": "default.normal", "notes": "TCP has a slow-start threshold, commonly called ssthresh. While the congestion window is below that threshold, slow-start growth can continue. Reaching the threshold or observing congestion changes what happens next. We will stop our explanation at that boundary, because slow start is one part of a larger congestion-control process. The point is that doubling is not meant to continue forever. The same graph that explains its speed also explains why it needs a stopping condition.", "id": "07-13", "chapter": "Test the idea", "animation_end_frame": 13421}, {"name": "Starting larger changes the early trip", "frame": 14237, "type": "default.normal", "notes": "Try starting with eight segments instead of four in the same idealized example. The growth sequence becomes eight, sixteen, thirty-two. That reaches the thirty-two-segment level one round earlier. A larger initial window can save an early round, but it also begins by placing more unconfirmed data on an unknown path. This is a trade-off, not free speed. Standards and implementations make practical initial-window choices; our animation isolates how that starting choice changes the first few rounds.", "id": "07-14", "chapter": "Test the idea", "animation_end_frame": 14564}, {"name": "Read a real trace carefully", "frame": 15307, "type": "default.normal", "notes": "Before turning this tidy curve into a universal rule, check the assumptions. Does the sender have enough data ready? Does the receiver have room? Are acknowledgments delayed or grouped? Is another bottleneck already limiting the flow? Each can alter what you observe. The congestion window is permission to have data outstanding, rather than an order to send at a smooth rate. The useful explanation survives those complications: confirmed progress helps the sender grow and pace its early traffic.", "id": "07-15", "chapter": "Test the idea", "animation_end_frame": 15517}, {"name": "Answer the speed puzzle", "frame": 16403, "type": "default.normal", "notes": "So the sender did not discover a perfect speed setting written somewhere inside the network. It began with limited outstanding data, used acknowledgments to make room and grow that allowance, and stopped the rapid growth when its rules required a transition. The math, the window, and the moving packets were three views of that same feedback process. Slow start is how a connection can begin exploring an uncertain path without treating either permanent caution or an immediate flood as its only option.", "id": "07-16", "chapter": "The answer", "animation_end_frame": 17180}], "captions": [[0.0, 4.625, "A download is ready to send millions of bytes.\nSomewhere ahead"], [4.625, 9.25, "is a connection that limits how quickly they\ncan pass, but"], [9.25, 13.875, "the sender does not begin with a map of its\navailable"], [13.875, 18.5, "capacity. Sending everything immediately could\noverwhelm it. Sending painfully little forever"], [18.5, 23.125, "wastes an opportunity. So how does a sender\nstart? Watch the"], [23.125, 27.75, "first packets and their returning\nacknowledgments. They will do more than"], [27.75, 32.375, "confirm delivery: they will help pace a\ngrowing experiment called TCP"], [32.375, 37.0, "slow start."], [37.0, 41.67916666666667, "Our picture has a sender, a receiver, and a\nbottleneck along"], [41.67916666666667, 46.358333333333334, "the path. Assume the receiver has plenty of\nfree buffer space,"], [46.358333333333334, 51.0375, "so its advertised window is not the limit in\nthis story."], [51.0375, 55.71666666666667, "We are focusing on the sender's congestion\nwindow, usually called cwnd."], [55.71666666666667, 60.395833333333336, "It bounds how many bytes may be outstanding\nwithout acknowledgment. That"], [60.395833333333336, 65.075, "is a quantity of data, not a transmission\nspeed printed on"], [65.075, 69.75416666666666, "the cable. Keeping those two meanings separate\nwill make the later"], [69.75416666666666, 74.43333333333334, "equation much easier."], [74. const $=id=>document.getElementById(id),film=$('film'),all=deck.sections,fps=deck.fps;
let current=0,state='ready',loaded=false,generation=0,presenter=null,started=false;
const start=i=>all[i].frame/fps;
const finish=i=>((i+1<all.length?all[i+1].frame:deck.frames)-0.5)/fps;
const motionFinish=i=>Math.min(finish(i),(all[i].animation_end_frame??((i+1<all.length?all[i+1].frame:deck.frames)-1))/fps);
const track=film.addTextTrack('captions','Guide captions','en');
for(const [a,b,t] of deck.captions)track.addCue(new VTTCue(a,b,t));
track.mode='hidden';
function sync(){
  const speed=`${film.playbackRate}×`;
  document.title=`${deck.title} · ${current+1}/${all.length} · ${speed}`;
  $('status').textContent=`Scene ${current+1} of ${all.length}: ${all[current].name}. ${state}. Speed ${speed}.`;
  if(presenter&&!presenter.closed){
    const d=presenter.document;
    d.getElementById('section').textContent=`${current+1} / ${all.length} — ${all[current].name}`;
    d.getElementById('script').textContent=all[current].notes;
    d.getElementById('speed').textContent=`Speed: ${speed}`;
    d.getElementById('scenes').value=current;
    d.getElementById('upnext').textContent=current+1<all.length?`Up next: ${all[current+1].name}`:'Final scene';
    const v=d.getElementById('preview');
    if(v.readyState>=1)v.currentTime=Math.min(film.currentTime,finish(current));
  }
}
function choose(i){if(!loaded)return;generation++;film.pause();current=Math.max(0,Math.min(i,all.length-1));state='ready';film.currentTime=finish(current);sync()}
function hold(){if(state!=='playing')return;generation++;film.pause();state='held';film.currentTime=finish(current);sync()}
function check(time){if(state==='playing'&&time>=motionFinish(current)-1/fps)hold()}
function watch(token){if(!film.requestVideoFrameCallback)return;film.requestVideoFrameCallback((_,meta)=>{if(token!==generation||state!=='playing')return;check(meta.mediaTime);if(state==='playing')watch(token)})}
async function run(restart=true){
  if(!loaded)return;
  const token=++generation;
  if(restart)film.currentTime=start(current)+0.5/fps;
  started=true;$('error').hidden=true;state='playing';sync();
  try{await film.play();if(token===generation)watch(token)}catch(e){if(token===generation){state='paused';sync();$('error').hidden=false;$('error').textContent=`Playback could not start: ${e.message}. Press P to retry.`}}
}
function next(){if(!loaded)return;if(!started&&!document.fullscreenElement)fullscreen();if(state!=='ready'){if(current===all.length-1)return;current++}run()}
function pause(){if(state==='playing'){generation++;film.pause();state='paused';sync()}else if(state==='paused')run(false)}
function fullscreen(){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else if($('app').requestFullscreen)$('app').requestFullscreen().catch(()=>{})}
function speed(delta){film.playbackRate=Math.max(.25,Math.min(4,Math.round((film.playbackRate+delta)*4)/4));sync()}
function openPresenter(){
  presenter=window.open('','networks-presenter','width=900,height=760');
  if(!presenter){$('status').textContent='Allow the presenter popup to read the script.';return}
  const d=presenter.document;d.title='Presenter notes — '+deck.title;d.body.replaceChildren();
  const style=d.createElement('style');style.textContent='body{background:#07111f;color:#edf4ff;font:22px/1.65 system-ui;padding:24px}h1{font-size:24px;color:#64d8eb}video{width:100%;max-height:230px;object-fit:contain}p{white-space:pre-wrap}button,select{padding:12px;margin:4px;background:#17334b;color:white;border:1px solid #456;border-radius:8px;font-size:18px}small{color:#9bb3ce}';d.head.append(style);
  const h=d.createElement('h1');h.id='section';d.body.append(h);
  const v=d.createElement('video');v.id='preview';v.src=film.currentSrc||film.src;v.muted=true;d.body.append(v);
  const n=d.createElement('p');n.id='script';d.body.append(n);
  const rate=d.createElement('p');rate.id='speed';d.body.append(rate);
  for(const [text,action] of [['← Previous',()=>choose(current-1)],['Replay',()=>run()],['Pause / Resume',pause],['Next →',next],['Slower ↓',()=>speed(-.25)],['Faster ↑',()=>speed(.25)]]){const b=d.createElement('button');b.textContent=text;b.onclick=action;d.body.append(b)}
  const select=d.createElement('select');select.id='scenes';select.setAttribute('aria-label','Choose scene');
  all.forEach((s,i)=>{const o=d.createElement('option');o.value=i;o.textContent=`${i+1}. ${s.name}`;select.append(o)});
  select.onchange=()=>choose(Number(select.value));d.body.append(select);
  const up=d.createElement('p');up.id='upnext';d.body.append(up);
  const small=d.createElement('small');small.textContent='Main window: video only. → next · ← previous · ↑/↓ speed (0.25× to 4×) · P pause · R replay · F fullscreen · C captions. Speed also appears in the main browser tab title.';d.body.append(small);
  d.addEventListener('keydown',key);v.addEventListener('loadedmetadata',sync,{once:true});sync();
}
function key(e){
  if(e.repeat||['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName))return;
  if(e.target.tagName==='BUTTON'&&[' ','Enter'].includes(e.key))return;
  if(e.shiftKey&&e.key.toLowerCase()==='p'){e.preventDefault();openPresenter();return}
  const actions={' ':next,Enter:next,ArrowRight:next,PageDown:next,ArrowLeft:()=>choose(current-1),PageUp:()=>choose(current-1),ArrowUp:()=>speed(.25),ArrowDown:()=>speed(-.25),r:()=>run(),p:pause,f:fullscreen,c:()=>{track.mode=track.mode==='showing'?'hidden':'showing'},Home:()=>choose(0),End:()=>choose(all.length-1)};
  const action=actions[e.key]||actions[e.key.toLowerCase()];if(action){e.preventDefault();action()}
}
film.onclick=next;
film.addEventListener('loadeddata',()=>{loaded=true;choose(0)},{once:true});
film.addEventListener('timeupdate',()=>check(film.currentTime));film.addEventListener('ended',hold);
film.addEventListener('ratechange',sync);
film.addEventListener('error',()=>{$('error').hidden=false;$('error').textContent='Cannot load episode.mp4. Keep it beside presentation.html, or open this lesson using the local server link in the README.'});
document.addEventListener('keydown',key);sync();
window.lessonState=()=>({current,state,loaded,time:film.currentTime,start:start(current),end:finish(current),motionEnd:motionFinish(current),count:all.length,speed:film.playbackRate});
</script></body></html>
