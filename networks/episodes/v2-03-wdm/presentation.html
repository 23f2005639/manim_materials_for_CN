<script>
"use strict";
const deck={"fps": 30, "frames": 17195, "sections": [{"name": "A message needs a path", "frame": 0, "type": "default.normal", "notes": "Start with a photo on your phone. To send it somewhere else, the phone must turn that photo into a pattern another device can read. A cable carries that changing pattern between places. Some cables use electrical signals. This thin glass strand uses light. It is an optical fiber. Watch one light pulse travel through it. That is our starting point: something changes at one end, and the other end detects the change.", "id": "03-01", "chapter": "Start with the basics", "animation_end_frame": 387}, {"name": "Two choices can carry information", "frame": 1030, "type": "default.normal", "notes": "How can light stand for a photo? Start much smaller: a yes or a no. We can agree that a bright pulse means one and a dark time means zero. Each choice is called a bit. Put many bits together, and their pattern can represent text, sound, or a picture. Our blinking light is a simple teaching example. Real equipment can use more detailed patterns, but the basic job stays the same: carry information using changes.", "id": "03-02", "chapter": "Start with the basics", "animation_end_frame": 1432}, {"name": "Meet the shape of light", "frame": 2100, "type": "default.normal", "notes": "Now look closer at the light itself. We draw it as a wave, with repeating peaks. This curve shows a repeating light property; the beam does not wiggle through the cable like a snake. The distance from one peak to the next is its wavelength. Wide spacing means a longer wavelength. Close spacing means a shorter one. That spacing gives us a way to tell different light signals apart, even when they share a path.", "id": "03-03", "chapter": "Start with the basics", "animation_end_frame": 2376}, {"name": "Four senders want to talk", "frame": 3156, "type": "default.normal", "notes": "Bring in four senders. Each has its own bits to send: four different conversations. So far, our easiest drawing gives every conversation its own path. Blue can carry one pattern while green carries another. Neither needs to copy the other. We call each separately usable signal path a channel. Four channels, four independent messages. But building a separate long cable for every conversation sounds expensive. Can these four channels share just one glass strand?", "id": "03-04", "chapter": "Start with the basics", "animation_end_frame": 3486}, {"name": "What if they look identical?", "frame": 4199, "type": "default.normal", "notes": "Before solving that, try a bad idea. Put two changing signals into the same wavelength region and ask the receiver to separate them using wavelength alone. There is no useful difference for that filter to select. Our colored boxes overlap to show the problem. Simply mixing more light is not enough. We need a recognizable difference that the receiving equipment can use. Think of labels on luggage: sharing a conveyor works better when the bags remain identifiable.", "id": "03-05", "chapter": "Build the idea", "animation_end_frame": 4358}, {"name": "Give each channel its own spacing", "frame": 5282, "type": "default.normal", "notes": "Here is the useful difference. Give each channel a different wavelength. Our four colors are labels for those different spacings. They do not mean four visible colored beams; communication fibers commonly carry infrared light that our eyes cannot see. Each channel also needs some space around its chosen wavelength because its information changes over time. Spread the channels apart, leaving suitable room for the signals and for equipment that will separate them later.", "id": "03-06", "chapter": "Build the idea", "animation_end_frame": 5465}, {"name": "Combine the light", "frame": 6312, "type": "default.normal", "notes": "At the sending end, an optical device brings the separate channels onto one shared path. It is called a multiplexer. The name is longer than the idea: many inputs, one shared output. Follow blue into the box, then green, yellow, and purple. Each still carries its own changing information. The device combines their light for the journey. It does not merge the four messages into a new sentence or make their bit patterns identical.", "id": "03-07", "chapter": "Build the idea", "animation_end_frame": 6885}, {"name": "Travel together through one fiber", "frame": 7355, "type": "default.normal", "notes": "Now watch the middle of the link. The four wavelength channels travel through the same fiber at the same time. Our small vertical gaps are only there so you can follow the colors on screen; there are no four little pipes inside the glass. This sharing method is wavelength division multiplexing, or WDM. The words now describe something we have already seen: divide the available wavelengths into channels, then let those channels share a fiber.", "id": "03-08", "chapter": "Build the idea", "animation_end_frame": 7607}, {"name": "Sort the light at the end", "frame": 8411, "type": "default.normal", "notes": "Sharing only helps if we can recover the separate information. At the far end, another optical device sorts different wavelength regions toward different outputs. It is called a demultiplexer: the separating partner of the combining box. Follow blue to its matching output. Green goes to another. The receivers can now detect changes in their selected channels. Four messages entered the system, traveled together, and came out as four separately readable streams. The wavelength difference survived the journey.", "id": "03-09", "chapter": "Build the idea", "animation_end_frame": 8984}, {"name": "Listen to just one conversation", "frame": 9494, "type": "default.normal", "notes": "Let us follow only the green channel. Dim the others so your eye can stay with one bit pattern. Green enters, travels alongside the other light, and reaches the green output. Its receiver reads those changes. It does not need the blue message to stop talking first. This is the central trick: the shared fiber carries several distinguishable channels at once. Our labels track their identities; the actual separation is performed by optical equipment designed for their wavelengths.", "id": "03-10", "chapter": "Build the idea", "animation_end_frame": 9776}, {"name": "Count the information per second", "frame": 10590, "type": "default.normal", "notes": "Now the numbers have a picture to attach to. A bit rate tells us how many bits a channel carries each second. Suppose each of our four channels carries one hundred billion bits per second. We shorten that to one hundred gigabits per second, written Gb/s. Add the channels one at a time: one hundred, two hundred, three hundred, four hundred. Four equal channels provide four hundred gigabits per second of combined raw capacity in this example.", "id": "03-11", "chapter": "Test and understand", "animation_end_frame": 10872}, {"name": "Bits and bytes are different", "frame": 11673, "type": "default.normal", "notes": "There is one small trap in that impressive number. File sizes often use bytes, while link rates often use bits. A byte is a group of eight bits. Watch eight little boxes become one group. To turn four hundred gigabits per second into gigabytes per second, divide by eight. The answer is fifty. That is a raw capacity conversion, not a promise that a download reaches fifty gigabytes every second. The rest of the system also takes time and capacity.", "id": "03-12", "chapter": "Test and understand", "animation_end_frame": 11805}, {"name": "Why not add colors forever?", "frame": 12796, "type": "default.normal", "notes": "If four channels help, why not squeeze in endlessly more? Look at the spaces between the channels. The equipment has a usable range, and the signals need enough room to remain distinguishable. Add too many into the same space and separation becomes harder. Noise and other physical effects matter too. Engineers must match the fiber, light sources, amplifiers, and receivers. More channels can increase capacity, but the drawing cannot create unlimited room that real equipment does not have.", "id": "03-13", "chapter": "Test and understand", "animation_end_frame": 13036}, {"name": "Different channels can have different rates", "frame": 13892, "type": "default.normal", "notes": "Our channels do not have to carry equal amounts. Keep blue and green at one hundred gigabits per second, but let yellow and purple carry fifty each. Add what each contributes: one hundred plus one hundred plus fifty plus fifty gives three hundred. The rule is still simple addition of the usable channel rates in our example. Counting colors alone is not enough. Four channels can have different total capacity depending on how much information each channel carries.", "id": "03-14", "chapter": "Test and understand", "animation_end_frame": 14174}, {"name": "Predict one missing channel", "frame": 14988, "type": "default.normal", "notes": "Try a quick prediction. Return to four channels carrying one hundred gigabits per second each. Now switch off the green transmitter while keeping the rest of our model unchanged. Does all the light stop? No. The other three channels still travel. The combined raw rate drops from four hundred to three hundred gigabits per second. Green has gone quiet; it has not taken the whole fiber with it. Distinct channels give us a useful way to understand the result.", "id": "03-15", "chapter": "Test and understand", "animation_end_frame": 15330}, {"name": "One strand, several readable streams", "frame": 16098, "type": "default.normal", "notes": "We can now rebuild the whole idea from the beginning. A message becomes a changing signal. Different wavelength channels give several signals identities the equipment can distinguish. One device combines them, one glass strand carries them, and another device separates them. Adding the channel rates tells us the combined raw capacity. That is WDM. The fiber did not become four separate cables. We learned how to let se const $=id=>document.getElementById(id),film=$('film'),all=deck.sections,fps=deck.fps;
let current=0,state='ready',loaded=false,generation=0,presenter=null,started=false;
const start=i=>all[i].frame/fps;
const finish=i=>((i+1<all.length?all[i+1].frame:deck.frames)-0.5)/fps;
const motionFinish=i=>Math.min(finish(i),(all[i].animation_end_frame??((i+1<all.length?all[i+1].frame:deck.frames)-1))/fps);
const track=film.addTextTrack('captions','Guide captions','en');
for(const [a,b,t] of deck.captions)track.addCue(new VTTCue(a,b,t));
track.mode='hidden';
function sync(){
  const speed=`${film.playbackRate}×`;
  document.title=`${deck.title} · ${current+1}/${all.length} · ${speed}`;
  $('status').textContent=`Scene ${current+1} of ${all.length}: ${all[current].name}. ${state}. Speed ${speed}.`;
  if(presenter&&!presenter.closed){
    const d=presenter.document;
    d.getElementById('section').textContent=`${current+1} / ${all.length} — ${all[current].name}`;
    d.getElementById('script').textContent=all[current].notes;
    d.getElementById('speed').textContent=`Speed: ${speed}`;
    d.getElementById('scenes').value=current;
    d.getElementById('upnext').textContent=current+1<all.length?`Up next: ${all[current+1].name}`:'Final scene';
    const v=d.getElementById('preview');
    if(v.readyState>=1)v.currentTime=Math.min(film.currentTime,finish(current));
  }
}
function choose(i){if(!loaded)return;generation++;film.pause();current=Math.max(0,Math.min(i,all.length-1));state='ready';film.currentTime=finish(current);sync()}
function hold(){if(state!=='playing')return;generation++;film.pause();state='held';film.currentTime=finish(current);sync()}
function check(time){if(state==='playing'&&time>=motionFinish(current)-1/fps)hold()}
function watch(token){if(!film.requestVideoFrameCallback)return;film.requestVideoFrameCallback((_,meta)=>{if(token!==generation||state!=='playing')return;check(meta.mediaTime);if(state==='playing')watch(token)})}
async function run(restart=true){
  if(!loaded)return;
  const token=++generation;
  if(restart)film.currentTime=start(current)+0.5/fps;
  started=true;$('error').hidden=true;state='playing';sync();
  try{await film.play();if(token===generation)watch(token)}catch(e){if(token===generation){state='paused';sync();$('error').hidden=false;$('error').textContent=`Playback could not start: ${e.message}. Press P to retry.`}}
}
function next(){if(!loaded)return;if(!started&&!document.fullscreenElement)fullscreen();if(state!=='ready'){if(current===all.length-1)return;current++}run()}
function pause(){if(state==='playing'){generation++;film.pause();state='paused';sync()}else if(state==='paused')run(false)}
function fullscreen(){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else if($('app').requestFullscreen)$('app').requestFullscreen().catch(()=>{})}
function speed(delta){film.playbackRate=Math.max(.25,Math.min(4,Math.round((film.playbackRate+delta)*4)/4));sync()}
function openPresenter(){
  presenter=window.open('','networks-presenter','width=900,height=760');
  if(!presenter){$('status').textContent='Allow the presenter popup to read the script.';return}
  const d=presenter.document;d.title='Presenter notes — '+deck.title;d.body.replaceChildren();
  const style=d.createElement('style');style.textContent='body{background:#07111f;color:#edf4ff;font:22px/1.65 system-ui;padding:24px}h1{font-size:24px;color:#64d8eb}video{width:100%;max-height:230px;object-fit:contain}p{white-space:pre-wrap}button,select{padding:12px;margin:4px;background:#17334b;color:white;border:1px solid #456;border-radius:8px;font-size:18px}small{color:#9bb3ce}';d.head.append(style);
  const h=d.createElement('h1');h.id='section';d.body.append(h);
  const v=d.createElement('video');v.id='preview';v.src=film.currentSrc||film.src;v.muted=true;d.body.append(v);
  const n=d.createElement('p');n.id='script';d.body.append(n);
  const rate=d.createElement('p');rate.id='speed';d.body.append(rate);
  for(const [text,action] of [['← Previous',()=>choose(current-1)],['Replay',()=>run()],['Pause / Resume',pause],['Next →',next],['Slower ↓',()=>speed(-.25)],['Faster ↑',()=>speed(.25)]]){const b=d.createElement('button');b.textContent=text;b.onclick=action;d.body.append(b)}
  const select=d.createElement('select');select.id='scenes';select.setAttribute('aria-label','Choose scene');
  all.forEach((s,i)=>{const o=d.createElement('option');o.value=i;o.textContent=`${i+1}. ${s.name}`;select.append(o)});
  select.onchange=()=>choose(Number(select.value));d.body.append(select);
  const up=d.createElement('p');up.id='upnext';d.body.append(up);
  const small=d.createElement('small');small.textContent='Main window: video only. → next · ← previous · ↑/↓ speed (0.25× to 4×) · P pause · R replay · F fullscreen · C captions. Speed also appears in the main browser tab title.';d.body.append(small);
  d.addEventListener('keydown',key);v.addEventListener('loadedmetadata',sync,{once:true});sync();
}
function key(e){
  if(e.repeat||['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName))return;
  if(e.target.tagName==='BUTTON'&&[' ','Enter'].includes(e.key))return;
  if(e.shiftKey&&e.key.toLowerCase()==='p'){e.preventDefault();openPresenter();return}
  const actions={' ':next,Enter:next,ArrowRight:next,PageDown:next,ArrowLeft:()=>choose(current-1),PageUp:()=>choose(current-1),ArrowUp:()=>speed(.25),ArrowDown:()=>speed(-.25),r:()=>run(),p:pause,f:fullscreen,c:()=>{track.mode=track.mode==='showing'?'hidden':'showing'},Home:()=>choose(0),End:()=>choose(all.length-1)};
  const action=actions[e.key]||actions[e.key.toLowerCase()];if(action){e.preventDefault();action()}
}
film.onclick=next;
film.addEventListener('loadeddata',()=>{loaded=true;choose(0)},{once:true});
film.addEventListener('timeupdate',()=>check(film.currentTime));film.addEventListener('ended',hold);
film.addEventListener('ratechange',sync);
film.addEventListener('error',()=>{$('error').hidden=false;$('error').textContent='Cannot load episode.mp4. Keep it beside presentation.html, or open this lesson using the local server link in the README.'});
document.addEventListener('keydown',key);sync();
window.lessonState=()=>({current,state,loaded,time:film.currentTime,start:start(current),end:finish(current),motionEnd:motionFinish(current),count:all.length,speed:film.playbackRate});
</script></body></html>
