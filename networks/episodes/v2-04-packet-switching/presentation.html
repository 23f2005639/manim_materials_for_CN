<script>
"use strict";
const deck={"fps": 30, "frames": 17540, "sections": [{"name": "The elephant and the message", "frame": 0, "type": "default.normal", "notes": "A huge transfer reaches a shared connection just before a tiny message. If the huge transfer holds the connection until its whole message finishes, the small one gets a very long wait. Yet the Internet carries enormous transfers and tiny interactions together. How does it divide their turns? Watch us replace one giant uninterrupted shape with smaller pieces. Those boundaries are not just a drawing choice. They create opportunities for other traffic to use the same physical link.", "id": "04-01", "chapter": "The puzzle", "animation_end_frame": 207}, {"name": "Give each piece an identity", "frame": 1096, "type": "default.normal", "notes": "Call each piece a packet. It carries a limited portion of the data, along with information needed to handle that piece. The receiver eventually needs the right content, but the network can now work with individual units instead of waiting for one entire application message. Our path stays fixed. We will not decide how that path was chosen or how an application recovers missing data. Our question is what dividing the transfer changes about sharing and timing.", "id": "04-02", "chapter": "The puzzle", "animation_end_frame": 1338}, {"name": "Sharing happens between packets", "frame": 2179, "type": "default.normal", "notes": "Let blue represent the large transfer and green the small message. Blue sends one packet, then green gets a turn before another blue packet. The link is still transmitting one sequence of bits. We did not create two simultaneous exits. What changed is the size of the indivisible turn: the waiting green data no longer needs the entire blue message to finish first. This interleaving is possible sharing, not a promise that every real queue always schedules these colors fairly.", "id": "04-03", "chapter": "See the mechanism", "animation_end_frame": 2611}, {"name": "Each packet still occupies time", "frame": 3302, "type": "default.normal", "notes": "A packet is smaller than the complete transfer, but it is not instantaneous. Its bits must enter the outgoing link one after another. Imagine the packet as a rectangle whose width is its transmission time. Making a smaller rectangle means finishing that turn sooner; making the link faster also makes the rectangle narrower. These are two different ways to reduce the time taken by one transmission. To calculate either change, we need the packet's length and the link's bit rate.", "id": "04-04", "chapter": "See the mechanism", "animation_end_frame": 3494}, {"name": "Build length divided by rate", "frame": 4425, "type": "default.normal", "notes": "Let L be the number of bits in a packet and R the number of bits the link can transmit each second. Sending L bits takes L divided by R seconds. Our example packet contains fifteen hundred bytes, or twelve thousand bits. On a ten-million-bit-per-second link, that occupies one point two milliseconds. We are calculating transmission time only. Signal travel adds delay, and it is left out of this particular arithmetic.", "id": "04-05", "chapter": "See the mechanism", "animation_end_frame": 4620}, {"name": "Store the packet before forwarding", "frame": 5428, "type": "default.normal", "notes": "Now add an intermediate switch in our model. It receives the complete packet before starting to send that packet on the next link. This is store-and-forward operation. Follow the blue rectangle: first it finishes arriving, then it begins leaving. The switch can use other forwarding methods in other settings, but keeping this rule explicit lets us reason clearly. A packet's boundary gives this switch a complete unit to receive, hold briefly, and forward toward the next fixed stop.", "id": "04-06", "chapter": "See the mechanism", "animation_end_frame": 5800}, {"name": "One packet crosses three links", "frame": 6524, "type": "default.normal", "notes": "Place three equal-rate links in a row. Our one packet occupies the first link for one point two milliseconds, then the second, then the third. Ignoring propagation, processing, and competing traffic, its final bit reaches the end after three point six milliseconds. Three links multiplied by one transmission time gives this result because our single packet must finish one store-and-forward step before beginning the next. There is not yet another packet available to overlap any of those steps.", "id": "04-07", "chapter": "See the mechanism", "animation_end_frame": 6712}, {"name": "Can the empty links work?", "frame": 7620, "type": "default.normal", "notes": "Now prepare four packets. After the first leaves the source, must the source remain idle until that packet reaches the destination? It does not. The first link is free for packet two while the first packet uses link two. This is the next opportunity created by dividing the message. Different links can handle different packets at the same time. The network becomes a pipeline, with several stages doing useful work during the same interval instead of waiting for one complete journey.", "id": "04-08", "chapter": "Understand the mathematics", "animation_end_frame": 7969}, {"name": "Fill the pipeline together", "frame": 8756, "type": "default.normal", "notes": "Watch the first three slots. At first, only the first link works. Next, links one and two work on different packets. Then all three links are occupied. Follow the packet colors: simultaneous work does not mean the same packet magically appears everywhere. Each packet still follows the store-and-forward rule. The overlap happens between different packets on different links, just as several items can occupy different stages of a process without any item skipping a stage.", "id": "04-09", "chapter": "Understand the mathematics", "animation_end_frame": 8993}, {"name": "Count six slots instead of twelve", "frame": 9812, "type": "default.normal", "notes": "For one packet, the journey needs three transmission slots. Once the pipeline is filled, each additional packet can finish one slot after the previous one. Four packets therefore need three slots for the first, then three more for the remaining packets: six slots total. At one point two milliseconds per slot, that is seven point two milliseconds. Sending each packet through the entire path before starting another would need twelve slots. The improvement comes from overlap, while the individual links keep the same rate.", "id": "04-10", "chapter": "Understand the mathematics", "animation_end_frame": 10157}, {"name": "Read the formula as a picture", "frame": 10988, "type": "default.normal", "notes": "With N equal packets and H equal-rate links, this ideal pipeline takes N plus H minus one transmission slots. Multiply that count by L divided by R to obtain the total time. The minus one is not a mysterious correction: the first packet is already included when we count the H slots that fill its journey. Unequal rates, propagation, processing, and other traffic change the timing. The formula describes our clean model.", "id": "04-11", "chapter": "Understand the mathematics", "animation_end_frame": 11144}, {"name": "Traffic does not arrive on schedule", "frame": 12004, "type": "default.normal", "notes": "Bring back the green message. Sources do not always take neat repeating turns. Some are quiet, some send bursts, and several can suddenly want the same output. Packet switching lets a link carry whichever packets are selected when capacity becomes available, instead of requiring each source to occupy a fixed turn continuously. That flexibility helps share a connection among uneven conversations. It also means we must examine what happens when several ready packets want the same next transmission opportunity.", "id": "04-12", "chapter": "Test the idea", "animation_end_frame": 12362}, {"name": "A queue is the waiting part", "frame": 13114, "type": "default.normal", "notes": "When arrivals reach an output faster than it can transmit, packets wait. Notice the green packet can still be delayed behind blue packets. Packet boundaries create chances for interleaving, but they do not guarantee a perfectly fair schedule, zero waiting, or unlimited capacity. If a finite queue fills, packets can be dropped. Those details limit our opening promise: breaking data into pieces makes flexible sharing possible, but the particular scheduling and available resources determine the experience each packet actually gets.", "id": "04-13", "chapter": "Test the idea", "animation_end_frame": 13330}, {"name": "Boundaries have a cost", "frame": 14237, "type": "default.normal", "notes": "Making packets tiny seems tempting. Each turn would finish quickly, so perhaps we should use the smallest pieces imaginable. But each packet also carries handling information, and equipment must process those packets. More pieces can mean more overhead for the same useful content. The picture shows that trade-off by keeping the useful blue payload separate from the small header. Packetization is a design choice balancing useful sharing opportunities, transmission efficiency, and the work required to handle individual units.", "id": "04-14", "chapter": "Test the idea", "animation_end_frame": 14393}, {"name": "Put the useful pieces back together", "frame": 15333, "type": "default.normal", "notes": "At the far end, follow the pieces belonging to the blue transfer and the green message. Their journeys shared resources, but their identities remain distinguishable. Recovering the complete application meaning requires the appropriate endpoint mechanisms, which sit outside our timing model. Our network's contribution was to move manageable units between successive links. It never needed the whole blue application message to occupy one continuous end-to-end turn before allowing green data onto the same shared infrastructure.", "id": "04-15", "chapter": "Test the idea", "animation_end_frame": 15796}, {"name": "Answer the opening puzzle", "frame": 16389, "type": "default.normal", "notes": "The tiny message escaped the elephant's full turn because the elephant was divided into packets. That created shorter opportunities for sharing. It also let different packets occupy successive links at once, turning a chain of transmissions into a pipeline. Queues, overhead, and finite rates still matter, so packet switching is not a trick for unlimited speed. Its power is more practical: many uneven conversations can share links in small units, while each link keeps doing one clear transmission job at a time.", "id": "04-16", "chapter": "The answer", "animation_end_frame": 16628}], "captions": [[0.0, 4.566666666666666, "A huge transfer reaches a shared connection\njust before a tiny"], [4.566666666666666, 9.133333333333333, "message. If the huge transfer holds the\nconnection until its whole"], [9.133333333333333, 13.7, "message finishes, the small one gets a very\nlong wait. Yet"], [13.7, 18.266666666666666, "the Internet carries enormous transfers and\ntiny interactions together. How does"], [18.266666666666666, 22.833333333333332, "it divide their turns? Watch us replace one\ngiant uninterrupted shape"], [22.833333333333332, 27.4, "with smaller pieces. Those boundaries are not\njust a drawing choice."], [27.4, 31.966666666666665, "They create opportunities for other traffic to\nuse the same physical"], [31.966666666666665, 36.53333333333333, "link."], [36.53333333333333, 41.69047619047619, "Call each piece a packet. It carries a limited\nportion of"], [41.69047619047619, 46.84761904761905, "the data, along with information needed to\nhandle that piece. The"], [46.84761904761905, 52.00476190476191, "receiver eventually needs the right content,\nbut the network can now"], [52.00476190476191, 57.161904761904765, "work with individual units instead of waiting\nfor one entire application"], [57.161904761904765, 62.31904761904762, "message. Our path stays fixed. We will not\ndecide how that"], [62.3190 const $=id=>document.getElementById(id),film=$('film'),all=deck.sections,fps=deck.fps;
let current=0,state='ready',loaded=false,generation=0,presenter=null,started=false;
const start=i=>all[i].frame/fps;
const finish=i=>((i+1<all.length?all[i+1].frame:deck.frames)-0.5)/fps;
const motionFinish=i=>Math.min(finish(i),(all[i].animation_end_frame??((i+1<all.length?all[i+1].frame:deck.frames)-1))/fps);
const track=film.addTextTrack('captions','Guide captions','en');
for(const [a,b,t] of deck.captions)track.addCue(new VTTCue(a,b,t));
track.mode='hidden';
function sync(){
  const speed=`${film.playbackRate}×`;
  document.title=`${deck.title} · ${current+1}/${all.length} · ${speed}`;
  $('status').textContent=`Scene ${current+1} of ${all.length}: ${all[current].name}. ${state}. Speed ${speed}.`;
  if(presenter&&!presenter.closed){
    const d=presenter.document;
    d.getElementById('section').textContent=`${current+1} / ${all.length} — ${all[current].name}`;
    d.getElementById('script').textContent=all[current].notes;
    d.getElementById('speed').textContent=`Speed: ${speed}`;
    d.getElementById('scenes').value=current;
    d.getElementById('upnext').textContent=current+1<all.length?`Up next: ${all[current+1].name}`:'Final scene';
    const v=d.getElementById('preview');
    if(v.readyState>=1)v.currentTime=Math.min(film.currentTime,finish(current));
  }
}
function choose(i){if(!loaded)return;generation++;film.pause();current=Math.max(0,Math.min(i,all.length-1));state='ready';film.currentTime=finish(current);sync()}
function hold(){if(state!=='playing')return;generation++;film.pause();state='held';film.currentTime=finish(current);sync()}
function check(time){if(state==='playing'&&time>=motionFinish(current)-1/fps)hold()}
function watch(token){if(!film.requestVideoFrameCallback)return;film.requestVideoFrameCallback((_,meta)=>{if(token!==generation||state!=='playing')return;check(meta.mediaTime);if(state==='playing')watch(token)})}
async function run(restart=true){
  if(!loaded)return;
  const token=++generation;
  if(restart)film.currentTime=start(current)+0.5/fps;
  started=true;$('error').hidden=true;state='playing';sync();
  try{await film.play();if(token===generation)watch(token)}catch(e){if(token===generation){state='paused';sync();$('error').hidden=false;$('error').textContent=`Playback could not start: ${e.message}. Press P to retry.`}}
}
function next(){if(!loaded)return;if(!started&&!document.fullscreenElement)fullscreen();if(state!=='ready'){if(current===all.length-1)return;current++}run()}
function pause(){if(state==='playing'){generation++;film.pause();state='paused';sync()}else if(state==='paused')run(false)}
function fullscreen(){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else if($('app').requestFullscreen)$('app').requestFullscreen().catch(()=>{})}
function speed(delta){film.playbackRate=Math.max(.25,Math.min(4,Math.round((film.playbackRate+delta)*4)/4));sync()}
function openPresenter(){
  presenter=window.open('','networks-presenter','width=900,height=760');
  if(!presenter){$('status').textContent='Allow the presenter popup to read the script.';return}
  const d=presenter.document;d.title='Presenter notes — '+deck.title;d.body.replaceChildren();
  const style=d.createElement('style');style.textContent='body{background:#07111f;color:#edf4ff;font:22px/1.65 system-ui;padding:24px}h1{font-size:24px;color:#64d8eb}video{width:100%;max-height:230px;object-fit:contain}p{white-space:pre-wrap}button,select{padding:12px;margin:4px;background:#17334b;color:white;border:1px solid #456;border-radius:8px;font-size:18px}small{color:#9bb3ce}';d.head.append(style);
  const h=d.createElement('h1');h.id='section';d.body.append(h);
  const v=d.createElement('video');v.id='preview';v.src=film.currentSrc||film.src;v.muted=true;d.body.append(v);
  const n=d.createElement('p');n.id='script';d.body.append(n);
  const rate=d.createElement('p');rate.id='speed';d.body.append(rate);
  for(const [text,action] of [['← Previous',()=>choose(current-1)],['Replay',()=>run()],['Pause / Resume',pause],['Next →',next],['Slower ↓',()=>speed(-.25)],['Faster ↑',()=>speed(.25)]]){const b=d.createElement('button');b.textContent=text;b.onclick=action;d.body.append(b)}
  const select=d.createElement('select');select.id='scenes';select.setAttribute('aria-label','Choose scene');
  all.forEach((s,i)=>{const o=d.createElement('option');o.value=i;o.textContent=`${i+1}. ${s.name}`;select.append(o)});
  select.onchange=()=>choose(Number(select.value));d.body.append(select);
  const up=d.createElement('p');up.id='upnext';d.body.append(up);
  const small=d.createElement('small');small.textContent='Main window: video only. → next · ← previous · ↑/↓ speed (0.25× to 4×) · P pause · R replay · F fullscreen · C captions. Speed also appears in the main browser tab title.';d.body.append(small);
  d.addEventListener('keydown',key);v.addEventListener('loadedmetadata',sync,{once:true});sync();
}
function key(e){
  if(e.repeat||['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName))return;
  if(e.target.tagName==='BUTTON'&&[' ','Enter'].includes(e.key))return;
  if(e.shiftKey&&e.key.toLowerCase()==='p'){e.preventDefault();openPresenter();return}
  const actions={' ':next,Enter:next,ArrowRight:next,PageDown:next,ArrowLeft:()=>choose(current-1),PageUp:()=>choose(current-1),ArrowUp:()=>speed(.25),ArrowDown:()=>speed(-.25),r:()=>run(),p:pause,f:fullscreen,c:()=>{track.mode=track.mode==='showing'?'hidden':'showing'},Home:()=>choose(0),End:()=>choose(all.length-1)};
  const action=actions[e.key]||actions[e.key.toLowerCase()];if(action){e.preventDefault();action()}
}
film.onclick=next;
film.addEventListener('loadeddata',()=>{loaded=true;choose(0)},{once:true});
film.addEventListener('timeupdate',()=>check(film.currentTime));film.addEventListener('ended',hold);
film.addEventListener('ratechange',sync);
film.addEventListener('error',()=>{$('error').hidden=false;$('error').textContent='Cannot load episode.mp4. Keep it beside presentation.html, or open this lesson using the local server link in the README.'});
document.addEventListener('keydown',key);sync();
window.lessonState=()=>({current,state,loaded,time:film.currentTime,start:start(current),end:finish(current),motionEnd:motionFinish(current),count:all.length,speed:film.playbackRate});
</script></body></html>
