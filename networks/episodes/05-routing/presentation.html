"use strict";
const deck={"fps": 30, "frames": 15301, "sections": [{"name": "Which route should this packet take?", "frame": 0, "type": "default.normal", "notes": "Which route should this packet take? The path with fewer links looks promising, but the costs tell a different story. Let's follow how a router can discover a better answer, then adapt when that answer breaks.", "id": "05-01", "chapter": "The routing puzzle", "animation_end_frame": 620}, {"name": "Turn the network into a graph", "frame": 648, "type": "default.normal", "notes": "Represent the network as a graph: points are devices, lines are connections, and numbers are costs. These positive example costs aren't automatically seconds or distance. They define what cheaper means in the problem we're solving.", "id": "05-02", "chapter": "The routing puzzle", "animation_end_frame": 1243}, {"name": "Add costs, not just hops", "frame": 1271, "type": "default.normal", "notes": "A-B-D-F has three links and costs fifteen. A-C-B-D-E-F has five links and costs thirteen. More steps, lower total. The drawing's apparent shortcut loses as soon as we add the numbers along both complete paths.", "id": "05-03", "chapter": "The routing puzzle", "animation_end_frame": 1877}, {"name": "Routing versus forwarding", "frame": 1906, "type": "default.normal", "notes": "Before calculating, separate routing from forwarding. Routing builds the choices; forwarding uses them to move a packet to its next hop. A packet can follow an established choice without running a new shortest-path calculation at every arrival.", "id": "05-04", "chapter": "The routing puzzle", "animation_end_frame": 2512}, {"name": "Start Dijkstra at A", "frame": 2541, "type": "default.normal", "notes": "Start Dijkstra's algorithm at A. Its distance is zero; others begin at infinity, meaning no route has been found. Repeatedly settle the lowest unfinished estimate, then ask whether routes through it improve the remaining estimates.", "id": "05-05", "chapter": "Dijkstra worked example", "animation_end_frame": 3136}, {"name": "Settle A and inspect its neighbors", "frame": 3164, "type": "default.normal", "notes": "From A, the first candidates are B at four and C at two. These are tentative distances. Reaching a node once doesn't prove we found its cheapest route; another connection might still offer a lower total.", "id": "05-06", "chapter": "Dijkstra worked example", "animation_end_frame": 3758}, {"name": "Settle C and improve B", "frame": 3786, "type": "default.normal", "notes": "C has the smallest estimate, so settle it next. Through C, B now costs two plus one: three instead of four. D becomes ten and E twelve. One settled point has improved several unfinished possibilities.", "id": "05-07", "chapter": "Dijkstra worked example", "animation_end_frame": 4393}, {"name": "Settle B and improve D", "frame": 4421, "type": "default.normal", "notes": "Next comes B at three. Its link to D costs five, giving a total of eight. Replace D's old ten and remember B as its predecessor. The number improves, and we save the reason it improved.", "id": "05-08", "chapter": "Dijkstra worked example", "animation_end_frame": 5015}, {"name": "Settle D and reach toward F", "frame": 5044, "type": "default.normal", "notes": "D is now cheapest at eight. Exploring its connections improves E to ten and discovers F at fourteen. We have reached the destination in our search, but shouldn't stop yet: a cheaper unfinished route may still exist.", "id": "05-09", "chapter": "Dijkstra worked example", "animation_end_frame": 5651}, {"name": "Settle E and improve F", "frame": 5679, "type": "default.normal", "notes": "Settle E at ten and add its three-cost link to F. Thirteen beats fourteen. Update F and record E as its predecessor. The earlier destination estimate was useful, but treating it as final would have missed this improvement.", "id": "05-10", "chapter": "Dijkstra worked example", "animation_end_frame": 6286}, {"name": "Finalize F: thirteen is optimal", "frame": 6314, "type": "default.normal", "notes": "F's thirteen is now the smallest unfinished distance, so settle it. The final distances from A are zero, three, two, eight, ten, and thirteen. With nonnegative link costs, the algorithm's settling rule makes those choices safe.", "id": "05-11", "chapter": "Dijkstra worked example", "animation_end_frame": 6921}, {"name": "Follow the predecessors backward", "frame": 6950, "type": "default.normal", "notes": "The costs alone aren't the route. Follow predecessors backward from F: E, D, B, C, A. Reverse that chain to recover the forward path. Each saved improvement left one clue that now reconstructs the entire journey.", "id": "05-12", "chapter": "Dijkstra worked example", "animation_end_frame": 7557}, {"name": "Install the next hop", "frame": 7585, "type": "default.normal", "notes": "For packets leaving A toward F, the next hop is C. The table can store that immediate choice rather than a full itinerary inside each packet. In real networks, entries commonly refer to destination address prefixes.", "id": "05-13", "chapter": "From algorithm to routers", "animation_end_frame": 8204}, {"name": "Distance vector: ask the neighbors", "frame": 8233, "type": "default.normal", "notes": "Distance-vector routing starts with different information. A neighbor advertises its distance to a destination; we add the cost of reaching that neighbor. Compare those totals, and select the best current option through the neighbors we know.", "id": "05-14", "chapter": "From algorithm to routers", "animation_end_frame": 8828}, {"name": "A numerical distance-vector update", "frame": 8856, "type": "default.normal", "notes": "B advertises ten to F; reaching B costs four, making fourteen. C advertises eleven; reaching C costs two, making thirteen. C wins. The smallest advertised distance alone wasn't enough; the local link cost matters too.", "id": "05-15", "chapter": "From algorithm to routers", "animation_end_frame": 9436}, {"name": "Link state: distribute the map", "frame": 9465, "type": "default.normal", "notes": "Link-state routing shares local connection facts instead. Routers distribute which links exist and their costs, build a map, and calculate routes from it. The shared information describes the network's pieces, rather than only destination-distance estimates.", "id": "05-16", "chapter": "From algorithm to routers", "animation_end_frame": 10098}, {"name": "Same goal, different information", "frame": 10127, "type": "default.normal", "notes": "Both approaches seek useful routes, but exchange different evidence: destination estimates or link facts. Neither learns changes instantly. Messages must travel, and routers need time to revise what they believe about the network.", "id": "05-17", "chapter": "From algorithm to routers", "animation_end_frame": 10760}, {"name": "Break the D-to-E link", "frame": 10788, "type": "default.normal", "notes": "Remove the D-to-E link. Our thirteen-cost route is broken. A-C-B-D-F now costs fourteen, beating the fifteen-cost alternative through C and E. A route is optimal only for the connections and costs that still exist.", "id": "05-18", "chapter": "When the network changes", "animation_end_frame": 11394}, {"name": "Convergence takes time", "frame": 11423, "type": "default.normal", "notes": "That change doesn't reach every router at once. Failure detection, update delivery, and recalculation take time. During convergence, routers can briefly hold inconsistent views. The network is updating many local decisions, not replacing one central map instantly.", "id": "05-19", "chapter": "When the network changes", "animation_end_frame": 12029}, {"name": "Why bad news can travel slowly", "frame": 12058, "type": "default.normal", "notes": "Watch two neighbors trust stale advice from each other. Each believes the other still reaches the destination, so their estimates keep increasing. This is counting to infinity. In RIP, sixteen represents unreachable, limiting that particular count.", "id": "05-20", "chapter": "When the network changes", "animation_end_frame": 12678}, {"name": "Reduce loops, but know the limits", "frame": 12707, "type": "default.normal", "notes": "Poisoned reverse blocks a specific circular claim. If A reaches a destination through C, it tells C that the destination is unreachable through A. That helps prevent two-node loops, though it doesn't eliminate every possible routing loop.", "id": "05-21", "chapter": "When the network changes", "animation_end_frame": 13340}, {"name": "A shortest path is not every policy", "frame": 13368, "type": "default.normal", "notes": "Change the costs and a different path can win. Shortest describes the selected metric, not necessarily physical distance or fewest hops. Real choices can also depend on policy, so understanding the objective matters before comparing routes.", "id": "05-22", "chapter": "Beyond the teaching graph", "animation_end_frame": 13974}, {"name": "Scale through hierarchy", "frame": 14003, "type": "default.normal", "notes": "At larger scales, sharing every detail everywhere becomes expensive. Hierarchy groups networks and summarizes address blocks, reducing the information each part must handle. The trade-off is deciding which details remain local and which need wider visibility.", "id": "05-23", "chapter": "Beyond the teaching graph", "animation_end_frame": 14623}, {"name": "Solve the opening puzzle", "frame": 14652, "type": "default.normal", "notes": "The opening packet chose a five-link route costing thirteen, then a different route costing fourteen after failure. The result wasn't a clever-looking line on a map. It came from comparing costs and keeping distributed information current.", "id": "05-24", "chapter": "Recap", "animation_end_frame": 15272}], "captions": [[0.0, 5.4, "Which route should this packet take? The path\nwith fewer links"], [5.4, 10.8, "looks promising, but the costs tell a\ndifferent story. Let's follow"], [10.8, 16.200000000000003, "how a router can discover a better a const $=id=>document.getElementById(id),film=$('film'),all=deck.sections,fps=deck.fps;
let current=0,state='ready',loaded=false,generation=0,presenter=null,started=false;
const start=i=>all[i].frame/fps;
const finish=i=>((i+1<all.length?all[i+1].frame:deck.frames)-0.5)/fps;
const motionFinish=i=>Math.min(finish(i),(all[i].animation_end_frame??((i+1<all.length?all[i+1].frame:deck.frames)-1))/fps);
const track=film.addTextTrack('captions','Guide captions','en');
for(const [a,b,t] of deck.captions)track.addCue(new VTTCue(a,b,t));
track.mode='hidden';
function sync(){
  const speed=`${film.playbackRate}×`;
  document.title=`${deck.title} · ${current+1}/${all.length} · ${speed}`;
  $('status').textContent=`Scene ${current+1} of ${all.length}: ${all[current].name}. ${state}. Speed ${speed}.`;
  if(presenter&&!presenter.closed){
    const d=presenter.document;
    d.getElementById('section').textContent=`${current+1} / ${all.length} — ${all[current].name}`;
    d.getElementById('script').textContent=all[current].notes;
    d.getElementById('speed').textContent=`Speed: ${speed}`;
    d.getElementById('scenes').value=current;
    d.getElementById('upnext').textContent=current+1<all.length?`Up next: ${all[current+1].name}`:'Final scene';
    const v=d.getElementById('preview');
    if(v.readyState>=1)v.currentTime=Math.min(film.currentTime,finish(current));
  }
}
function choose(i){if(!loaded)return;generation++;film.pause();current=Math.max(0,Math.min(i,all.length-1));state='ready';film.currentTime=finish(current);sync()}
function hold(){if(state!=='playing')return;generation++;film.pause();state='held';film.currentTime=finish(current);sync()}
function check(time){if(state==='playing'&&time>=motionFinish(current)-1/fps)hold()}
function watch(token){if(!film.requestVideoFrameCallback)return;film.requestVideoFrameCallback((_,meta)=>{if(token!==generation||state!=='playing')return;check(meta.mediaTime);if(state==='playing')watch(token)})}
async function run(restart=true){
  if(!loaded)return;
  const token=++generation;
  if(restart)film.currentTime=start(current)+0.5/fps;
  started=true;$('error').hidden=true;state='playing';sync();
  try{await film.play();if(token===generation)watch(token)}catch(e){if(token===generation){state='paused';sync();$('error').hidden=false;$('error').textContent=`Playback could not start: ${e.message}. Press P to retry.`}}
}
function next(){if(!loaded)return;if(!started&&!document.fullscreenElement)fullscreen();if(state!=='ready'){if(current===all.length-1)return;current++}run()}
function pause(){if(state==='playing'){generation++;film.pause();state='paused';sync()}else if(state==='paused')run(false)}
function fullscreen(){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else if($('app').requestFullscreen)$('app').requestFullscreen().catch(()=>{})}
function speed(delta){film.playbackRate=Math.max(.25,Math.min(4,Math.round((film.playbackRate+delta)*4)/4));sync()}
function openPresenter(){
  presenter=window.open('','networks-presenter','width=900,height=760');
  if(!presenter){$('status').textContent='Allow the presenter popup to read the script.';return}
  const d=presenter.document;d.title='Presenter notes — '+deck.title;d.body.replaceChildren();
  const style=d.createElement('style');style.textContent='body{background:#07111f;color:#edf4ff;font:22px/1.65 system-ui;padding:24px}h1{font-size:24px;color:#64d8eb}video{width:100%;max-height:230px;object-fit:contain}p{white-space:pre-wrap}button,select{padding:12px;margin:4px;background:#17334b;color:white;border:1px solid #456;border-radius:8px;font-size:18px}small{color:#9bb3ce}';d.head.append(style);
  const h=d.createElement('h1');h.id='section';d.body.append(h);
  const v=d.createElement('video');v.id='preview';v.src=film.currentSrc||film.src;v.muted=true;d.body.append(v);
  const n=d.createElement('p');n.id='script';d.body.append(n);
  const rate=d.createElement('p');rate.id='speed';d.body.append(rate);
  for(const [text,action] of [['← Previous',()=>choose(current-1)],['Replay',()=>run()],['Pause / Resume',pause],['Next →',next],['Slower ↓',()=>speed(-.25)],['Faster ↑',()=>speed(.25)]]){const b=d.createElement('button');b.textContent=text;b.onclick=action;d.body.append(b)}

}
function key(e){
  if(e.repeat||['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName))return;
  if(e.target.tagName==='BUTTON'&&[' ','Enter'].includes(e.key))return;
  if(e.shiftKey&&e.key.toLowerCase()==='p'){e.preventDefault();openPresenter();return}
  const actions={' ':next,Enter:next,ArrowRight:next,PageDown:next,ArrowLeft:()=>choose(current-1),PageUp:()=>choose(current-1),ArrowUp:()=>speed(.25),ArrowDown:()=>speed(-.25),r:()=>run(),p:pause,f:fullscreen,c:()=>{track.mode=track.mode==='showing'?'hidden':'showing'},Home:()=>choose(0),End:()=>choose(all.length-1)};
  const action=actions[e.key]||actions[e.key.toLowerCase()];if(action){e.preventDefault();action()}
}
film.onclick=next;
