"use strict";
const deck={"fps": 30, "frames": 17356, "sections": [{"name": "A device needs an address", "frame": 0, "type": "default.normal", "notes": "Imagine a small office with several computers. When one computer sends a message, how do the others know who it is for? Each needs an address, a little like a house number. Here we use IPv4 addresses, written as four numbers with dots between them. Watch a message go to the computer marked 192.168.1.20. Our question today is how to divide one collection of these addresses into smaller groups. That division is called subnetting.", "id": "06-01", "chapter": "Start from zero", "animation_end_frame": 231}, {"name": "Start with one tiny choice", "frame": 1043, "type": "default.normal", "notes": "Before dividing anything, meet the smallest building block: a bit. A bit can be zero or one. Think of a switch with just two positions. Put eight bits side by side and they can represent one of the numbers in our address. All four numbers together use thirty-two bits. The dots make the address easier for people to read; underneath, it is a row of zeros and ones. We will mostly watch the final eight positions.", "id": "06-02", "chapter": "Start from zero", "animation_end_frame": 1253}, {"name": "Keep the beginning the same", "frame": 2113, "type": "default.normal", "notes": "Look at these addresses: they all start with 192.168.1, while the last number changes. Those first three numbers use twenty-four bits. If we keep those bits fixed, we get one group with eight positions left to change. We write the group as 192.168.1.0 slash twenty-four. The slash tells us how many beginning bits stay fixed. That shared beginning is called a prefix. It is simply the part every address in this group has in common.", "id": "06-03", "chapter": "Start from zero", "animation_end_frame": 2356}, {"name": "Count the possible endings", "frame": 3169, "type": "default.normal", "notes": "One free bit has two choices: zero or one. Two free bits have four: zero-zero, zero-one, one-zero, one-one. Every extra free bit doubles the choices. Keep doubling until eight bits give two hundred and fifty-six possibilities. We write that as two to the power of eight. The final number can therefore run from zero through two hundred and fifty-five. Zero counts as a possibility too. Now we know the size of the group we are about to divide.", "id": "06-04", "chapter": "Start from zero", "animation_end_frame": 3370}, {"name": "Split the group in half", "frame": 4265, "type": "default.normal", "notes": "Take the first of those eight free bits and use it to choose a side. Zero means the left half; one means the right half. Seven bits are still free inside each half, giving one hundred and twenty-eight addresses apiece. Each smaller group now shares twenty-five beginning bits, so we call it slash twenty-five. Nothing new has been added. The same addresses have been sorted into two groups, just as one drawer can be divided into two compartments.", "id": "06-05", "chapter": "Build the idea", "animation_end_frame": 4418}, {"name": "Split each half again", "frame": 5361, "type": "default.normal", "notes": "Use one more bit to split each half. Now the group labels are zero-zero, zero-one, one-zero, and one-one. Two choices followed by two choices make four groups. These smaller address groups are our subnets. Each shares twenty-six beginning bits, so each is slash twenty-six. This is why moving the boundary just two places turns one network's address block into four smaller blocks. The labels may look technical, but underneath we have only made two yes-or-no choices.", "id": "06-06", "chapter": "Build the idea", "animation_end_frame": 5607}, {"name": "Count what each group holds", "frame": 6431, "type": "default.normal", "notes": "We started with eight free positions and used two to choose a group. That leaves six positions to choose addresses inside each group. These are called host bits; a host is a device using an address. Six free bits give sixty-four combinations. Check our work: four groups times sixty-four addresses equals two hundred and fifty-six, exactly where we began. A longer shared beginning makes each individual group smaller, because fewer bits remain free to change.", "id": "06-07", "chapter": "Build the idea", "animation_end_frame": 6539}, {"name": "Find where each group starts", "frame": 7487, "type": "default.normal", "notes": "Put zeros in all six positions inside each group. That gives its first address. Change only the two group bits and watch the starts appear: zero, sixty-four, one hundred and twenty-eight, one hundred and ninety-two. We only show the last number here; 192.168.1 stays the same throughout. Why do the starts jump by sixty-four? Each group occupies sixty-four places. The next group starts immediately after those places finish. We can count the spaces instead of memorizing four special numbers.", "id": "06-08", "chapter": "Build the idea", "animation_end_frame": 7736}, {"name": "Make a stencil for the boundary", "frame": 8597, "type": "default.normal", "notes": "A computer needs a way to mark which bits belong to the shared beginning. We use a mask, like a stencil: ones mark the shared positions, zeros mark the changing positions. Our first twenty-four bits are shared, plus two more in the final group of eight. That last pattern is one-one followed by six zeros. The first two positions are worth one hundred and twenty-eight and sixty-four. Add them to get one hundred and ninety-two. Our mask is 255.255.255.192.", "id": "06-09", "chapter": "Try it yourself", "animation_end_frame": 8732}, {"name": "Where does address seventy belong?", "frame": 9707, "type": "default.normal", "notes": "Try the address ending in seventy. In bits, seventy is zero-one-zero-zero-zero-one-one-zero. Place our mask underneath it. Keep an address bit where the mask has a one; replace it with zero where the mask has a zero. This operation is called AND. The answer is zero-one followed by six zeros: sixty-four. So seventy belongs to the group starting at sixty-four. The mask has erased the individual device's part and left the group's starting address behind.", "id": "06-10", "chapter": "Try it yourself", "animation_end_frame": 9923}, {"name": "Two addresses have special jobs", "frame": 10750, "type": "default.normal", "notes": "Can we give all sixty-four addresses to computers? In this ordinary local network example, two have other jobs. The first address names the whole subnet. The last is the broadcast address, used for a message addressed to everyone in that subnet. That leaves sixty-two device addresses: sixty-four minus two. Remember what we counted before: total addresses, not just device addresses. Some special network arrangements use different rules, so we are applying this subtraction to our ordinary local network example.", "id": "06-11", "chapter": "Try it yourself", "animation_end_frame": 10894}, {"name": "Read the first two groups", "frame": 11860, "type": "default.normal", "notes": "The first group runs from zero to sixty-three. Reserve zero for the network and sixty-three for broadcast. Computers use one through sixty-two. The next group runs from sixty-four to one hundred and twenty-seven. Reserve those endpoints, leaving sixty-five through one hundred and twenty-six for computers. Follow the colored ends of each bar as we name their jobs. Broadcast does not always end in two hundred and fifty-five. It is the final address of the particular subnet we chose.", "id": "06-12", "chapter": "Try it yourself", "animation_end_frame": 12001}, {"name": "Finish the address map", "frame": 12956, "type": "default.normal", "notes": "The third group starts at one hundred and twenty-eight and ends at one hundred and ninety-one. Its device addresses sit between those endpoints. The fourth starts at one hundred and ninety-two and ends at two hundred and fifty-five, again with the middle addresses available for devices. Look across all four bars. They fit together withou const $=id=>document.getElementById(id),film=$('film'),all=deck.sections,fps=deck.fps;
let current=0,state='ready',loaded=false,generation=0,presenter=null,started=false;
const start=i=>all[i].frame/fps;
const finish=i=>((i+1<all.length?all[i+1].frame:deck.frames)-0.5)/fps;
const motionFinish=i=>Math.min(finish(i),(all[i].animation_end_frame??((i+1<all.length?all[i+1].frame:deck.frames)-1))/fps);
const track=film.addTextTrack('captions','Guide captions','en');
for(const [a,b,t] of deck.captions)track.addCue(new VTTCue(a,b,t));
track.mode='hidden';
function sync(){
  const speed=`${film.playbackRate}×`;
  document.title=`${deck.title} · ${current+1}/${all.length} · ${speed}`;
  $('status').textContent=`Scene ${current+1} of ${all.length}: ${all[current].name}. ${state}. Speed ${speed}.`;
  if(presenter&&!presenter.closed){
    const d=presenter.document;
    d.getElementById('section').textContent=`${current+1} / ${all.length} — ${all[current].name}`;
    d.getElementById('script').textContent=all[current].notes;
    d.getElementById('speed').textContent=`Speed: ${speed}`;
    d.getElementById('scenes').value=current;
    d.getElementById('upnext').textContent=current+1<all.length?`Up next: ${all[current+1].name}`:'Final scene';
    const v=d.getElementById('preview');
    if(v.readyState>=1)v.currentTime=Math.min(film.currentTime,finish(current));
  }
}
function choose(i){if(!loaded)return;generation++;film.pause();current=Math.max(0,Math.min(i,all.length-1));state='ready';film.currentTime=finish(current);sync()}
function hold(){if(state!=='playing')return;generation++;film.pause();state='held';film.currentTime=finish(current);sync()}
function check(time){if(state==='playing'&&time>=motionFinish(current)-1/fps)hold()}
function watch(token){if(!film.requestVideoFrameCallback)return;film.requestVideoFrameCallback((_,meta)=>{if(token!==generation||state!=='playing')return;check(meta.mediaTime);if(state==='playing')watch(token)})}
async function run(restart=true){
  if(!loaded)return;
  const token=++generation;
  if(restart)film.currentTime=start(current)+0.5/fps;
  started=true;$('error').hidden=true;state='playing';sync();
  try{await film.play();if(token===generation)watch(token)}catch(e){if(token===generation){state='paused';sync();$('error').hidden=false;$('error').textContent=`Playback could not start: ${e.message}. Press P to retry.`}}
}
function next(){if(!loaded)return;if(!started&&!document.fullscreenElement)fullscreen();if(state!=='ready'){if(current===all.length-1)return;current++}run()}
function pause(){if(state==='playing'){generation++;film.pause();state='paused';sync()}else if(state==='paused')run(false)}
function fullscreen(){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else if($('app').requestFullscreen)$('app').requestFullscreen().catch(()=>{})}
function speed(delta){film.playbackRate=Math.max(.25,Math.min(4,Math.round((film.playbackRate+delta)*4)/4));sync()}
function openPresenter(){
  presenter=window.open('','networks-presenter','width=900,height=760');
  if(!presenter){$('status').textContent='Allow the presenter popup to read the script.';return}
  const d=presenter.document;d.title='Presenter notes — '+deck.title;d.body.replaceChildren();
  const style=d.createElement('style');style.textContent='body{background:#07111f;color:#edf4ff;font:22px/1.65 system-ui;padding:24px}h1{font-size:24px;color:#64d8eb}video{width:100%;max-height:230px;object-fit:contain}p{white-space:pre-wrap}button,select{padding:12px;margin:4px;background:#17334b;color:white;border:1px solid #456;border-radius:8px;font-size:18px}small{color:#9bb3ce}';d.head.append(style);
  const h=d.createElement('h1');h.id='section';d.body.append(h);
  const v=d.createElement('video');v.id='preview';v.src=film.currentSrc||film.src;v.muted=true;d.body.append(v);
  const n=d.createElement('p');n.id='script';d.body.append(n);
  const rate=d.createElement('p');rate.id='speed';d.body.append(rate);
  for(const [text,action] of [['← Previous',()=>choose(current-1)],['Replay',()=>run()],['Pause / Resume',pause],['Next →',next],['Slower ↓',()=>speed(-.25)],['Faster ↑',()=>speed(.25)]]){const b=d.createElement('button');b.textContent=text;b.onclick=action;d.body.append(b)}
  const select=d.createElement('select');select.id='scenes';select.setAttribute('aria-label','Choose scene');
  all.forEach((s,i)=>{const o=d.createElement('option');o.value=i;o.textContent=`${i+1}. ${s.name}`;select.append(o)});
  select.onchange=()=>choose(Number(select.value));d.body.append(select);
  const up=d.createElement('p');up.id='upnext';d.body.append(up);
  const small=d.createElement('small');small.textContent='Main window: video only. → next · ← previous · ↑/↓ speed (0.25× to 4×) · P pause · R replay · F fullscreen · C captions. Speed also appears in the main browser tab title.';d.body.append(small);
  d.addEventListener('keydown',key);v.addEventListener('loadedmetadata',sync,{once:true});sync();
}
function key(e){
  if(e.repeat||['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName))return;
  if(e.target.tagName==='BUTTON'&&[' ','Enter'].includes(e.key))return;
  if(e.shiftKey&&e.key.toLowerCase()==='p'){e.preventDefault();openPresenter();return}
  const actions={' ':next,Enter:next,ArrowRight:next,PageDown:next,ArrowLeft:()=>choose(current-1),PageUp:()=>choose(current-1),ArrowUp:()=>speed(.25),ArrowDown:()=>speed(-.25),r:()=>run(),p:pause,f:fullscreen,c:()=>{track.mode=track.mode==='showing'?'hidden':'showing'},Home:()=>choose(0),End:()=>choose(all.length-1)};
  const action=actions[e.key]||actions[e.key.toLowerCase()];if(action){e.preventDefault();action()}
}
film.onclick=next;
film.addEventListener('loadeddata',()=>{loaded=true;choose(0)},{once:true});
film.addEventListener('timeupdate',()=>check(film.currentTime));film.addEventListener('ended',hold);
film.addEventListener('ratechange',sync);
film.addEventListener('error',()=>{$('error').hidden=false;$('error').textContent='Cannot load episode.mp4. Keep it beside presentation.html, or open this lesson using the local server link in the README.'});
document.addEventListener('keydown',key);sync();
window.lessonState=()=>({current,state,loaded,time:film.currentTime,start:start(current),end:finish(current),motionEnd:motionFinish(current),count:all.length,speed:film.playbackRate});
</script></body></html>
