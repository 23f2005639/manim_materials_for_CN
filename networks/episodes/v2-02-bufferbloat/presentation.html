"use strict";
const deck={"fps": 30, "frames": 17369, "sections": [{"name": "The speed-test paradox", "frame": 0, "type": "default.normal", "notes": "Your download counter is flying. The connection looks healthy. Then a tiny action in a game takes forever to reach the other side. How can a fast connection also feel slow? Watch the small green packet. It contains almost nothing compared with the blue transfer, but it has arrived at exactly the wrong moment. The mystery is not how fast bits can leave. It is how long this particular packet must wait before they can leave at all.", "id": "02-01", "chapter": "The puzzle", "animation_end_frame": 385}, {"name": "One shared exit", "frame": 1096, "type": "default.normal", "notes": "Here is our entire model: arrivals on the left, a waiting area in the middle, and one outgoing link on the right. Everything that needs that exit must share it. Blue packets carry a large transfer; green packets represent a small interactive exchange. Their colors help us follow them, but this queue gives neither color special treatment. For now, the rule is first in, first out. Earlier arrivals stand ahead of later arrivals, regardless of how urgently someone wants a reply.", "id": "02-02", "chapter": "The puzzle", "animation_end_frame": 1590}, {"name": "The exit has a rhythm", "frame": 2232, "type": "default.normal", "notes": "Watch the departure marks. The outgoing link can put only a certain number of bits onto the wire each second. Even when several packets arrive together, they cannot all occupy the same transmission time. They leave in a sequence. The waiting area absorbs that difference between arrivals and departures. This is useful: a short burst does not have to disappear simply because its packets arrived close together. Persistent waiting is the part we need to understand.", "id": "02-03", "chapter": "See the mechanism", "animation_end_frame": 2745}, {"name": "An empty queue feels quick", "frame": 3302, "type": "default.normal", "notes": "Start with very little traffic. The green packet arrives, finds no blue line ahead of it, and moves toward the exit almost immediately. The complete exchange still takes time: signals travel, equipment processes data, and the other endpoint responds. But our queue adds almost no extra delay in this case. We are about to change the amount waiting, while leaving the outgoing link itself exactly the same.", "id": "02-04", "chapter": "See the mechanism", "animation_end_frame": 3788}, {"name": "A download builds a line", "frame": 4252, "type": "default.normal", "notes": "Now bring in the bulk transfer. For a while, arrivals outrun the exit. Blue packets accumulate faster than the link can remove them, so the line grows backward. The outgoing link stays busy throughout. A throughput display can therefore look impressive even as waiting gets worse. These measurements differ: throughput counts how much data gets through over time; delay measures how long an individual piece takes. A busy exit can produce plenty of throughput and plenty of delay together.", "id": "02-05", "chapter": "See the mechanism", "animation_end_frame": 4627}, {"name": "The small packet gets trapped", "frame": 5362, "type": "default.normal", "notes": "Here comes the green packet again. Predict what happens before it reaches the line. Its small size will make its own transmission brief, but that does not move it past earlier packets. In our first-in, first-out queue, it waits behind all the blue data already present. The green packet has not become larger. The physical route has not become longer. Yet the interaction now feels late because a new kind of distance has appeared: a distance measured in waiting bits.", "id": "02-06", "chapter": "See the mechanism", "animation_end_frame": 5804}, {"name": "More storage is not more speed", "frame": 6485, "type": "default.normal", "notes": "Suppose we make the waiting area twice as large. Does the green packet escape sooner? The larger buffer can hold more arrivals, but the outgoing link still removes bits at the same rate. Under sustained load, the longer space can become a longer line. That is the trap behind bufferbloat: oversized or poorly managed queues can hold a great deal of delay. Extra storage helps absorb bursts, but storage alone cannot increase the exit's transmission capacity.", "id": "02-07", "chapter": "See the mechanism", "animation_end_frame": 6815}, {"name": "Turn the line into a quantity", "frame": 7555, "type": "default.normal", "notes": "Let's replace our drawn packets with an amount of data. Call the bits waiting ahead of the green packet Q. Call the outgoing bit rate R. Each second, the exit removes approximately R of those bits, assuming it remains available to this queue. So how many seconds clear Q? Divide the amount to be removed by the amount removed each second. The picture is already doing the division; the equation simply gives that movement a compact name.", "id": "02-08", "chapter": "Understand the mathematics", "animation_end_frame": 7754}, {"name": "Bytes and bits must agree", "frame": 8638, "type": "default.normal", "notes": "Our example has one megabyte waiting ahead of the green packet. Here mega means one million, so that is one million bytes. The link rate, however, is measured in bits per second. Eight bits make a byte, which turns our waiting amount into eight million bits. Dividing a byte count directly by a bit rate would quietly make the answer eight times too small. The units tell us which quantities are allowed to meet.", "id": "02-09", "chapter": "Understand the mathematics", "animation_end_frame": 8887}, {"name": "Four hundred milliseconds of waiting", "frame": 9681, "type": "default.normal", "notes": "The exit runs at twenty million bits per second. Eight million waiting bits divided by twenty million bits per second gives zero point four seconds: four hundred milliseconds. Notice what disappeared in the division: bits cancel, leaving seconds. That is the time needed to clear the data ahead, before our green packet gets its turn. It is an illustrative queueing calculation, not a claim that every twenty-megabit connection always adds four hundred milliseconds to every interaction.", "id": "02-10", "chapter": "Understand the mathematics", "animation_end_frame": 10367}, {"name": "The round trip has other parts", "frame": 10751, "type": "default.normal", "notes": "Now place that waiting beside the rest of the journey. Propagation, processing, transmission, and any other queues still contribute. A request and its response can also face different conditions in different directions. Our four hundred milliseconds is one added waiting component, not a complete prediction of a ping measurement. This is why a speed-test result cannot describe the whole experience. It tells us something useful about transfer capacity, but it does not reveal where every packet spends its time.", "id": "02-11", "chapter": "Understand the mathematics", "animation_end_frame": 10985}, {"name": "Watch arrivals and departures", "frame": 11861, "type": "default.normal", "notes": "The line grows when arrivals exceed departures. It shrinks when departures exceed arrivals. And if those amounts balance while the line is already long, the line can remain long. a steady queue does not mean zero delay. Watch the height stop growing while the green packets still wait behind a large amount of blue data. The problem can persist without an endlessly rising graph or an ever-increasing memory requirement.", "id": "02-12", "chapter": "Test the idea", "animation_end_frame": 12331}, {"name": "A burst can be harmless", "frame": 12837, "type": "default.normal", "notes": "Compare two bursts. In the first, a short rush creates a queue, then quiet time lets it drain. Later interactive traffic finds an empty path again. In the second, new data keeps replacing what leaves, maintaining the queue. Both pictures contain buffering, but their delay experience is different. The goal is not to declare every queued packet a failure. It is to distinguish a temporary cushion for uneven arrivals from a standing line that repeatedly delays useful interactions.", "id": "02-13", "chapter": "Test the idea", "animation_end_frame": 13304}, {"name": "A full queue can also drop", "frame": 13933, "type": "default.normal", "notes": "Eventually, a finite buffer can fill. A new arrival may then be discarded instead of joining the line. More buffer space might postpone that moment, but it can also allow a larger standing delay before anything is dropped. Loss and delay are different outcomes, and neither should be hidden by looking at only one meter. Our model is deliberately simple; real equipment can manage queues in more sophisticated ways. The essential issue remains the amount kept waiting at a constrained exit.", "id": "02-14", "chapter": "Test the idea", "animation_end_frame": 14201}, {"name": "What would a better picture look like?", "frame": 15069, "type": "default.normal", "notes": "Keep the same outgoing rate, but compare a long standing queue with a shorter controlled queue. Useful traffic still crosses the link, while the green packet spends less time waiting behind old data. The important improvement is visible before any product name or configuration screen appears: reduce persistent queueing while using the connection well. Real mechanisms have trade-offs, and an empty buffer is not a universal goal. We are identifying the behavior a solution should improve, rather than promising one setting fixes every network.", "id": "02-15", "chapter": "Test the idea", "animation_end_frame": 15576}, {"name": "Answer the opening puzzle", "frame": 16245, "type": "default.normal", "notes": "Return to the fast download and the late interaction. There was no contradiction. The connection moved many bits each second, while our small packet waited behind bits that arrived first. Bufferbloat describes that excessive queueing delay under load. It is one explanation for lag, not a diagnosis o const $=id=>document.getElementById(id),film=$('film'),all=deck.sections,fps=deck.fps;
let current=0,state='ready',loaded=false,generation=0,presenter=null,started=false;
const start=i=>all[i].frame/fps;
const finish=i=>((i+1<all.length?all[i+1].frame:deck.frames)-0.5)/fps;
const motionFinish=i=>Math.min(finish(i),(all[i].animation_end_frame??((i+1<all.length?all[i+1].frame:deck.frames)-1))/fps);
const track=film.addTextTrack('captions','Guide captions','en');
for(const [a,b,t] of deck.captions)track.addCue(new VTTCue(a,b,t));
track.mode='hidden';
function sync(){
  const speed=`${film.playbackRate}×`;
  document.title=`${deck.title} · ${current+1}/${all.length} · ${speed}`;
  $('status').textContent=`Scene ${current+1} of ${all.length}: ${all[current].name}. ${state}. Speed ${speed}.`;
  if(presenter&&!presenter.closed){
    const d=presenter.document;
    d.getElementById('section').textContent=`${current+1} / ${all.length} — ${all[current].name}`;
    d.getElementById('script').textContent=all[current].notes;
    d.getElementById('speed').textContent=`Speed: ${speed}`;
    d.getElementById('scenes').value=current;
    d.getElementById('upnext').textContent=current+1<all.length?`Up next: ${all[current+1].name}`:'Final scene';
    const v=d.getElementById('preview');
    if(v.readyState>=1)v.currentTime=Math.min(film.currentTime,finish(current));
  }
}
function choose(i){if(!loaded)return;generation++;film.pause();current=Math.max(0,Math.min(i,all.length-1));state='ready';film.currentTime=finish(current);sync()}
function hold(){if(state!=='playing')return;generation++;film.pause();state='held';film.currentTime=finish(current);sync()}
function check(time){if(state==='playing'&&time>=motionFinish(current)-1/fps)hold()}
function watch(token){if(!film.requestVideoFrameCallback)return;film.requestVideoFrameCallback((_,meta)=>{if(token!==generation||state!=='playing')return;check(meta.mediaTime);if(state==='playing')watch(token)})}
async function run(restart=true){
  if(!loaded)return;
  const token=++generation;
  if(restart)film.currentTime=start(current)+0.5/fps;
  started=true;$('error').hidden=true;state='playing';sync();
  try{await film.play();if(token===generation)watch(token)}catch(e){if(token===generation){state='paused';sync();$('error').hidden=false;$('error').textContent=`Playback could not start: ${e.message}. Press P to retry.`}}
}
function next(){if(!loaded)return;if(!started&&!document.fullscreenElement)fullscreen();if(state!=='ready'){if(current===all.length-1)return;current++}run()}
function pause(){if(state==='playing'){generation++;film.pause();state='paused';sync()}else if(state==='paused')run(false)}
function fullscreen(){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else if($('app').requestFullscreen)$('app').requestFullscreen().catch(()=>{})}
function speed(delta){film.playbackRate=Math.max(.25,Math.min(4,Math.round((film.playbackRate+delta)*4)/4));sync()}
function openPresenter(){
  presenter=window.open('','networks-presenter','width=900,height=760');
  if(!presenter){$('status').textContent='Allow the presenter popup to read the script.';return}
  const d=presenter.document;d.title='Presenter notes — '+deck.title;d.body.replaceChildren();
  const style=d.createElement('style');style.textContent='body{background:#07111f;color:#edf4ff;font:22px/1.65 system-ui;padding:24px}h1{font-size:24px;color:#64d8eb}video{width:100%;max-height:230px;object-fit:contain}p{white-space:pre-wrap}button,select{padding:12px;margin:4px;background:#17334b;color:white;border:1px solid #456;border-radius:8px;font-size:18px}small{color:#9bb3ce}';d.head.append(style);
  const h=d.createElement('h1');h.id='section';d.body.append(h);
  const v=d.createElement('video');v.id='preview';v.src=film.currentSrc||film.src;v.muted=true;d.body.append(v);
  const n=d.createElement('p');n.id='script';d.body.append(n);
  const rate=d.createElement('p');rate.id='speed';d.body.append(rate);
  for(const [text,action] of [['← Previous',()=>choose(current-1)],['Replay',()=>run()],['Pause / Resume',pause],['Next →',next],['Slower ↓',()=>speed(-.25)],['Faster ↑',()=>speed(.25)]]){const b=d.createElement('button');b.textContent=text;b.onclick=action;d.body.append(b)}
  const select=d.createElement('select');select.id='scenes';select.setAttribute('aria-label','Choose scene');
  all.forEach((s,i)=>{const o=d.createElement('option');o.value=i;o.textContent=`${i+1}. ${s.name}`;select.append(o)});
  select.onchange=()=>choose(Number(select.value));d.body.append(select);
  const up=d.createElement('p');up.id='upnext';d.body.append(up);
  const small=d.createElement('small');small.textContent='Main window: video only. → next · ← previous · ↑/↓ speed (0.25× to 4×) · P pause · R replay · F fullscreen · C captions. Speed also appears in the main browser tab title.';d.body.append(small);
  d.addEventListener('keydown',key);v.addEventListener('loadedmetadata',sync,{once:true});sync();
}
function key(e){
  if(e.repeat||['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName))return;
  if(e.target.tagName==='BUTTON'&&[' ','Enter'].includes(e.key))return;
  if(e.shiftKey&&e.key.toLowerCase()==='p'){e.preventDefault();openPresenter();return}
  const actions={' ':next,Enter:next,ArrowRight:next,PageDown:next,ArrowLeft:()=>choose(current-1),PageUp:()=>choose(current-1),ArrowUp:()=>speed(.25),ArrowDown:()=>speed(-.25),r:()=>run(),p:pause,f:fullscreen,c:()=>{track.mode=track.mode==='showing'?'hidden':'showing'},Home:()=>choose(0),End:()=>choose(all.length-1)};
  const action=actions[e.key]||actions[e.key.toLowerCase()];if(action){e.preventDefault();action()}
}
film.onclick=next;
film.addEventListener('loadeddata',()=>{loaded=true;choose(0)},{once:true});
film.addEventListener('timeupdate',()=>check(film.currentTime));film.addEventListener('ended',hold);
film.addEventListener('ratechange',sync);
film.addEventListener('error',()=>{$('error').hidden=false;$('error').textContent='Cannot load episode.mp4. Keep it beside presentation.html, or open this lesson using the local server link in the README.'});
document.addEventListener('keydown',key);sync();
window.lessonState=()=>({current,state,loaded,time:film.currentTime,start:start(current),end:finish(current),motionEnd:motionFinish(current),count:all.length,speed:film.playbackRate});
</script></body></html>
