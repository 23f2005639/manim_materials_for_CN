<script>
"use strict";
const deck={"fps": 30, "frames": 17542, "sections": [{"name": "Who can read this message?", "frame": 0, "type": "default.normal", "notes": "Suppose you send a friend a private message: meet at seven. On its journey, someone else might see the data. If the message is readable, that person can read it too. So we want to change it into something they cannot understand, then let our friend change it back. That process is encryption. A simple approach uses a shared secret. But here is a puzzle: how do we send privately to someone before we have shared that secret?", "id": "08-01", "chapter": "Start with the basics", "animation_end_frame": 342}, {"name": "A lock with two different jobs", "frame": 1096, "type": "default.normal", "notes": "Picture your friend handing out open padlocks while keeping the opening key. Anyone can put a message in a box and snap a lock shut. Only your friend can open it. RSA uses a mathematical version of two different jobs: a public rule for encrypting and a private rule for recovering the message. Computers represent messages as numbers, so our tiny demonstration will protect the number seven. The padlock is an analogy; the real work will be arithmetic.", "id": "08-02", "chapter": "Start with the basics", "animation_end_frame": 1300}, {"name": "Keep what is left over", "frame": 2192, "type": "default.normal", "notes": "Before any keys, we need one easy operation: a remainder. Put eleven counters into groups of five. Two full groups use ten counters, leaving one. Eleven divided by five has remainder one. The short mathematical name is modulo: eleven mod five equals one. We will later use groups of fifty-five, but the idea is identical. Keep what is left after removing complete groups. No mysterious new kind of number, just the leftover amount.", "id": "08-03", "chapter": "Start with the basics", "animation_end_frame": 2412}, {"name": "Build the number fifty-five", "frame": 3222, "type": "default.normal", "notes": "Choose five and eleven. Both are prime numbers: whole numbers greater than one that divide evenly only by one and themselves. Primes act like building blocks for multiplication. Multiply our two choices and we get fifty-five. That becomes the number we will use when keeping remainders. We call it n, simply a short label. Our public instructions will include fifty-five. The two factors, five and eleven, help us build the private instructions. These tiny numbers are for seeing the idea.", "id": "08-04", "chapter": "Start with the basics", "animation_end_frame": 3408}, {"name": "Find a useful repeating structure", "frame": 4345, "type": "default.normal", "notes": "Why did we keep those two factors? They help describe a repeating pattern in the remainder arithmetic. Look at the numbers from zero through fifty-four. Cross out multiples of five and multiples of eleven. Forty positions remain. None of those shares a factor with fifty-five except one. For these primes, we can count them as four times ten: forty. Keep that number nearby. We will use its repeating structure to choose two operations that work together, rather than guessing a secret.", "id": "08-05", "chapter": "Build the idea", "animation_end_frame": 4531}, {"name": "The public rule repeats a multiplication", "frame": 5481, "type": "default.normal", "notes": "Let our public instruction be: multiply three copies of the message number together, then keep the remainder after dividing by fifty-five. Three copies multiplied together is called the third power, or cubing. We label that power e, and choose e equal to three. The public key is just the pair fifty-five and three. Why this choice? Three and our count of forty share no factor above one, which lets us find a matching private power next.", "id": "08-06", "chapter": "Build the idea", "animation_end_frame": 5634}, {"name": "Choose a matching private rule", "frame": 6551, "type": "default.normal", "notes": "Now find a number which, when multiplied by three, leaves one after removing complete groups of forty. Twenty-seven works. Three times twenty-seven is eighty-one, and eighty-one is forty plus forty plus one. We label the matching private power d, so d is twenty-seven. Notice the important part: this number was chosen to fit the public operation. It is not an unrelated password. The relationship between three, twenty-seven, and forty is what will let the two operations cooperate.", "id": "08-07", "chapter": "Build the idea", "animation_end_frame": 6689}, {"name": "Turn seven into thirteen", "frame": 7634, "type": "default.normal", "notes": "Time to send our tiny message, seven. Follow the public rule: seven times seven times seven is three hundred and forty-three. Remove complete groups of fifty-five. Six groups account for three hundred and thirty, leaving thirteen. That leftover number is the encrypted result, also called ciphertext. Seven has become thirteen. Anyone with the public pair fifty-five and three can perform this forward calculation. We have now watched encryption happen, using only multiplication and keeping a remainder.", "id": "08-08", "chapter": "Build the idea", "animation_end_frame": 7778}, {"name": "Keep the numbers manageable", "frame": 8704, "type": "default.normal", "notes": "The private rule asks us to use a much bigger power. Must we write an enormous number first? Happily, no. We can keep remainders while calculating. Start with thirteen. Square it, meaning multiply it by itself: one hundred and sixty-nine leaves four after division by fifty-five. Square that four to get sixteen. Square sixteen and keep its remainder, thirty-six. Each step keeps the same useful remainder information while preventing the working numbers from growing without limit.", "id": "08-09", "chapter": "Build the idea", "animation_end_frame": 8908}, {"name": "Bring the message back", "frame": 9774, "type": "default.normal", "notes": "Now use the private power, twenty-seven. We can split it into sixteen plus eight plus two plus one. The boxes show the remainders of thirteen raised to those powers. Multiply those values together, keeping the remainder after each step. Watch the result settle on seven. We recovered the original message. Written compactly, thirteen to the power twenty-seven, mod fifty-five, equals seven. The arithmetic looks longer than encryption, but it uses the same two actions: multiply and keep a remainder.", "id": "08-10", "chapter": "Build the idea", "animation_end_frame": 10041}, {"name": "Why the pair fits together", "frame": 10884, "type": "default.normal", "notes": "The interesting question is why seven returns. For numbers such as seven, which share no factor with fifty-five except one, these powers have a repeating structure linked to our count of forty. Encrypting with power three and decrypting with power twenty-seven combines into power eighty-one. That is one plus two times forty. The matching construction brings us back to the original value. The circle illustrates repetition; it is not a claim that every message takes exactly forty steps to repeat.", "id": "08-11", "chapter": "Test and understand", "animation_end_frame": 11127}, {"name": "Try the wrong private number", "frame": 12007, "type": "default.normal", "notes": "What if we replace twenty-seven with a guess? Use five instead. The same encrypted number thirteen now produces forty-three, not seven. The right side uses twenty-seven and recovers seven. So the private rule is not simply any large number or any secret number. It must fit the public construction. This small experiment does not prove security. It shows what correctness requires: the intended pair must undo the message transformation, while an arbitrary guess generally does not.", "id": "08-12", "chapter": "Test and understand", "animation_end_frame": 12184}, {"name": "What must remain hard?", "frame": 13077, "type": "default.normal", "notes": "Our public key contains fifty-five, but not its two prime factors. If someone discovers five and eleven, they can repeat our private-key construction: calculate forty, then find the matching power twenty-seven. For fifty-five that is easy, which is why this example protects nothing. Real RSA uses far larger carefully generated primes. Multiplying them is practical, while recovering their factors from the product is intended to be difficult. The security depends on such mathematical assumptions and on correct implementation.", "id": "08-13", "chapter": "Test and understand", "animation_end_frame": 13251}, {"name": "The tiny example needs boundaries", "frame": 14173, "type": "default.normal", "notes": "There is another reason not to use our little calculation directly as real encryption. Encrypt seven twice with this bare rule and thirteen appears twice. That visible repetition can leak information. Practical encryption needs a complete, carefully designed encoding scheme that adds the right structure and randomness before the RSA operation. We are looking inside one mathematical mechanism, not building a safe messaging app. The small numbers let us understand the moving parts without pretending that understanding alone makes them secure.", "id": "08-14", "chapter": "Test and understand", "animation_end_frame": 14329}, {"name": "Connect the two kinds of rules", "frame": 15309, "type": "default.normal", "notes": "Step back from the arithmetic. With a shared-secret method, the people communicating must have a suitable secret in common. With this public-key arrangement, the receiving person can publish the encrypting instructions and keep the recovery instructions private. The private key is related to the public key, but should be impractical to derive from it. That last condition matters. Publishing an operation is useful only if seeing how to perform it does not make recovering the private operation easy.", "id": "08-15", "chapter": "Test and understand", "animation_end_frame": 15516}, {"name": "Rebuild the idea from the start", "frame": 16405, "type": "default.normal", "notes": "We wante const $=id=>document.getElementById(id),film=$('film'),all=deck.sections,fps=deck.fps;
let current=0,state='ready',loaded=false,generation=0,presenter=null,started=false;
const start=i=>all[i].frame/fps;
const finish=i=>((i+1<all.length?all[i+1].frame:deck.frames)-0.5)/fps;
const motionFinish=i=>Math.min(finish(i),(all[i].animation_end_frame??((i+1<all.length?all[i+1].frame:deck.frames)-1))/fps);
const track=film.addTextTrack('captions','Guide captions','en');
for(const [a,b,t] of deck.captions)track.addCue(new VTTCue(a,b,t));
track.mode='hidden';
function sync(){
  const speed=`${film.playbackRate}×`;
  document.title=`${deck.title} · ${current+1}/${all.length} · ${speed}`;
  $('status').textContent=`Scene ${current+1} of ${all.length}: ${all[current].name}. ${state}. Speed ${speed}.`;
  if(presenter&&!presenter.closed){
    const d=presenter.document;
    d.getElementById('section').textContent=`${current+1} / ${all.length} — ${all[current].name}`;
    d.getElementById('script').textContent=all[current].notes;
    d.getElementById('speed').textContent=`Speed: ${speed}`;
    d.getElementById('scenes').value=current;
    d.getElementById('upnext').textContent=current+1<all.length?`Up next: ${all[current+1].name}`:'Final scene';
    const v=d.getElementById('preview');
    if(v.readyState>=1)v.currentTime=Math.min(film.currentTime,finish(current));
  }
}
function choose(i){if(!loaded)return;generation++;film.pause();current=Math.max(0,Math.min(i,all.length-1));state='ready';film.currentTime=finish(current);sync()}
function hold(){if(state!=='playing')return;generation++;film.pause();state='held';film.currentTime=finish(current);sync()}
function check(time){if(state==='playing'&&time>=motionFinish(current)-1/fps)hold()}
function watch(token){if(!film.requestVideoFrameCallback)return;film.requestVideoFrameCallback((_,meta)=>{if(token!==generation||state!=='playing')return;check(meta.mediaTime);if(state==='playing')watch(token)})}
async function run(restart=true){
  if(!loaded)return;
  const token=++generation;
  if(restart)film.currentTime=start(current)+0.5/fps;
  started=true;$('error').hidden=true;state='playing';sync();
  try{await film.play();if(token===generation)watch(token)}catch(e){if(token===generation){state='paused';sync();$('error').hidden=false;$('error').textContent=`Playback could not start: ${e.message}. Press P to retry.`}}
}
function next(){if(!loaded)return;if(!started&&!document.fullscreenElement)fullscreen();if(state!=='ready'){if(current===all.length-1)return;current++}run()}
function pause(){if(state==='playing'){generation++;film.pause();state='paused';sync()}else if(state==='paused')run(false)}
function fullscreen(){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else if($('app').requestFullscreen)$('app').requestFullscreen().catch(()=>{})}
function speed(delta){film.playbackRate=Math.max(.25,Math.min(4,Math.round((film.playbackRate+delta)*4)/4));sync()}
function openPresenter(){
  presenter=window.open('','networks-presenter','width=900,height=760');
  if(!presenter){$('status').textContent='Allow the presenter popup to read the script.';return}
  const d=presenter.document;d.title='Presenter notes — '+deck.title;d.body.replaceChildren();
  const style=d.createElement('style');style.textContent='body{background:#07111f;color:#edf4ff;font:22px/1.65 system-ui;padding:24px}h1{font-size:24px;color:#64d8eb}video{width:100%;max-height:230px;object-fit:contain}p{white-space:pre-wrap}button,select{padding:12px;margin:4px;background:#17334b;color:white;border:1px solid #456;border-radius:8px;font-size:18px}small{color:#9bb3ce}';d.head.append(style);
  const h=d.createElement('h1');h.id='section';d.body.append(h);
  const v=d.createElement('video');v.id='preview';v.src=film.currentSrc||film.src;v.muted=true;d.body.append(v);
  const n=d.createElement('p');n.id='script';d.body.append(n);
  const rate=d.createElement('p');rate.id='speed';d.body.append(rate);
  for(const [text,action] of [['← Previous',()=>choose(current-1)],['Replay',()=>run()],['Pause / Resume',pause],['Next →',next],['Slower ↓',()=>speed(-.25)],['Faster ↑',()=>speed(.25)]]){const b=d.createElement('button');b.textContent=text;b.onclick=action;d.body.append(b)}
  const select=d.createElement('select');select.id='scenes';select.setAttribute('aria-label','Choose scene');
  all.forEach((s,i)=>{const o=d.createElement('option');o.value=i;o.textContent=`${i+1}. ${s.name}`;select.append(o)});
  select.onchange=()=>choose(Number(select.value));d.body.append(select);
  const up=d.createElement('p');up.id='upnext';d.body.append(up);
  const small=d.createElement('small');small.textContent='Main window: video only. → next · ← previous · ↑/↓ speed (0.25× to 4×) · P pause · R replay · F fullscreen · C captions. Speed also appears in the main browser tab title.';d.body.append(small);
  d.addEventListener('keydown',key);v.addEventListener('loadedmetadata',sync,{once:true});sync();
}
function key(e){
  if(e.repeat||['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName))return;
  if(e.target.tagName==='BUTTON'&&[' ','Enter'].includes(e.key))return;
  if(e.shiftKey&&e.key.toLowerCase()==='p'){e.preventDefault();openPresenter();return}
  const actions={' ':next,Enter:next,ArrowRight:next,PageDown:next,ArrowLeft:()=>choose(current-1),PageUp:()=>choose(current-1),ArrowUp:()=>speed(.25),ArrowDown:()=>speed(-.25),r:()=>run(),p:pause,f:fullscreen,c:()=>{track.mode=track.mode==='showing'?'hidden':'showing'},Home:()=>choose(0),End:()=>choose(all.length-1)};
  const action=actions[e.key]||actions[e.key.toLowerCase()];if(action){e.preventDefault();action()}
}
film.onclick=next;
film.addEventListener('loadeddata',()=>{loaded=true;choose(0)},{once:true});
film.addEventListener('timeupdate',()=>check(film.currentTime));film.addEventListener('ended',hold);
film.addEventListener('ratechange',sync);
film.addEventListener('error',()=>{$('error').hidden=false;$('error').textContent='Cannot load episode.mp4. Keep it beside presentation.html, or open this lesson using the local server link in the README.'});
document.addEventListener('keydown',key);sync();
window.lessonState=()=>({current,state,loaded,time:film.currentTime,start:start(current),end:finish(current),motionEnd:motionFinish(current),count:all.length,speed:film.playbackRate});
</script></body></html>
