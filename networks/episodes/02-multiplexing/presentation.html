<script>
"use strict";
const deck={"fps": 30, "frames": 15751, "sections": [{"name": "Three senders, one cable", "frame": 0, "type": "default.normal", "notes": "Three cameras, three streams, one cable. If the signals share the same path, why don't they become one unreadable mess? The answer depends on a rule that makes combining them reversible.", "id": "02-01", "chapter": "The puzzle", "animation_end_frame": 634}, {"name": "A medium is not a channel", "frame": 657, "type": "default.normal", "notes": "First separate two ideas. The medium is the physical path; a channel is a way of using that path. One cable can support several channels when the equipment gives their signals distinguishable places or turns.", "id": "02-02", "chapter": "The puzzle", "animation_end_frame": 1278}, {"name": "Combine, carry, separate", "frame": 1301, "type": "default.normal", "notes": "At one end, the multiplexer combines the inputs. At the other, the demultiplexer separates them. The important ingredient sits between those names: both ends must agree on exactly how the sharing works.", "id": "02-03", "chapter": "The model", "animation_end_frame": 1948}, {"name": "Read a frequency picture", "frame": 1970, "type": "default.normal", "notes": "A wave changes over time. Frequency counts its cycles each second; bandwidth describes a range of frequencies. Shift your attention to the frequency view: it shows where each signal occupies part of that range.", "id": "02-04", "chapter": "Frequency division", "animation_end_frame": 2579}, {"name": "Give every stream a band", "frame": 2601, "type": "default.normal", "notes": "Place each stream in a different frequency band. Now all three can travel at once because their assigned bands differ. Frequency division makes simultaneous sharing possible by separating signals along the frequency axis.", "id": "02-05", "chapter": "Frequency division", "animation_end_frame": 3236}, {"name": "Leave room between neighbors", "frame": 3258, "type": "default.normal", "notes": "Why leave gaps between the bands? Real filters have gradual edges, so neighboring signals could interfere. Guard bands provide space between them. The price of cleaner separation is spectrum that carries no channel here.", "id": "02-06", "chapter": "Frequency division", "animation_end_frame": 3880}, {"name": "Filter at the receiver", "frame": 3902, "type": "default.normal", "notes": "At the receiver, select the green band. A bandpass filter passes that range and reduces others. The green stream doesn't wait for the rest to finish; the receiver separates it by frequency while they coexist.", "id": "02-07", "chapter": "Frequency division", "animation_end_frame": 4536}, {"name": "Work an FDM allocation", "frame": 4559, "type": "default.normal", "notes": "Three bands need twenty kilohertz each. Two gaps need five each. Add the occupied widths: twenty, five, twenty, five, twenty. Seventy kilohertz covers this arrangement, before any extra margins at the outer edges.", "id": "02-08", "chapter": "Worked example", "animation_end_frame": 5193}, {"name": "What happens when one is idle?", "frame": 5216, "type": "default.normal", "notes": "Now one camera goes quiet. Its reserved band stays empty while the others keep their allocations. The same clear separation that makes this scheme simple can leave capacity unused when traffic becomes uneven.", "id": "02-09", "chapter": "Frequency division", "animation_end_frame": 5850}, {"name": "Now divide the time axis", "frame": 5872, "type": "default.normal", "notes": "Instead of separating streams by frequency, separate them by time. Let each source use the shared path during an assigned turn. The receiver identifies the source by when its data appears in the schedule.", "id": "02-10", "chapter": "Time division", "animation_end_frame": 6494}, {"name": "Assign repeating time slots", "frame": 6516, "type": "default.normal", "notes": "Follow the order: A, B, C, then repeat. The combined stream alternates between sources, and the receiver reconstructs three outputs from those positions. What looks mixed in transit becomes separate again by following the schedule.", "id": "02-11", "chapter": "Time division", "animation_end_frame": 7138}, {"name": "Understand a TDM frame", "frame": 7160, "type": "default.normal", "notes": "One complete round of slots forms a TDM frame in this example. Here, frame means a repeating timing group. The same word appears elsewhere in networking with other meanings, so keep this particular structure in view.", "id": "02-12", "chapter": "Time division", "animation_end_frame": 7808}, {"name": "Keep the schedule aligned", "frame": 7830, "type": "default.normal", "notes": "The schedule only works if both ends agree on its boundaries. Shift the receiver's timing and it assigns data to the wrong source. Synchronization is part of the sharing mechanism, not an optional finishing touch.", "id": "02-13", "chapter": "Time division", "animation_end_frame": 8464}, {"name": "Work a TDM rate example", "frame": 8487, "type": "default.normal", "notes": "Each camera produces two megabits per second. Together they require six megabits per second of useful shared capacity. A practical link needs room for synchronization and other overhead too; useful data isn't the whole transmitted stream.", "id": "02-14", "chapter": "Worked example", "animation_end_frame": 9134}, {"name": "The empty-slot problem", "frame": 9156, "type": "default.normal", "notes": "When B has no data, its assigned turn still arrives. That empty slot reveals the weakness of a fixed schedule: capacity can go unused even while other sources have work waiting to be sent.", "id": "02-15", "chapter": "Time division", "animation_end_frame": 9790}, {"name": "Allocate turns on demand", "frame": 9813, "type": "default.normal", "notes": "Give turns only to sources with data, and those empty positions can disappear. That's statistical TDM. The receiver now needs identifiers or equivalent shared information, since a fixed repeating order no longer tells the whole story.", "id": "02-16", "chapter": "Time division", "animation_end_frame": 10448}, {"name": "Move from copper to fiber", "frame": 10470, "type": "default.normal", "notes": "Change the medium to fiber. Several optical channels can share a strand, represented here by different colors. The drawing tracks their identities; real systems select particular optical wavelengths rather than relying on our display colors.", "id": "02-17", "chapter": "Wavelength division", "animation_end_frame": 11118}, {"name": "Combine different wavelengths", "frame": 11140, "type": "default.normal", "notes": "Wavelength division carries those optical channels together using different wavelengths. They travel simultaneously through the same fiber. The sharing resembles frequency separation, now implemented with light and the optical equipment needed to handle it.", "id": "02-18", "chapter": "Wavelength division", "animation_end_frame": 11762}, {"name": "Separate the light again", "frame": 11784, "type": "default.normal", "notes": "At the far end, optical components separate the combined wavelengths into their outputs. Without that final separation, combining channels wouldn't help. The receiver completes the rule that made sharing one strand useful.", "id": "02-19", "chapter": "Wavelength division", "animation_end_frame": 12418}, {"name": "Work a WDM capacity example", "frame": 12440, "type": "default.normal", "notes": "Four channels at ten gigabits per second each produce forty gigabits per second of raw combined rate. The multiplication is simple; interpreting it matters. Application throughput can be lower after the system's overhead is included.", "id": "02-20", "chapter": "Worked example", "animation_end_frame": 13100}, {"name": "Sharing has physical limits", "frame": 13123, "type": "default.normal", "notes": "More channels don't remove the limits of the medium. Light can weaken, pulses can spread, and noise can disrupt recovery. Multiplexing organizes available resources; it doesn't create an unlimited, perfectly clean connection.", "id": "02-21", "chapter": "Limits", "animation_end_frame": 13744}, {"name": "Compare the three schemes", "frame": 13767, "type": "default.normal", "notes": "Compare the pictures. FDM separates frequency bands; TDM separates time slots; WDM separates optical wavelengths. Each gives the receiver a different clue for reconstructing the original inputs after they shared a path.", "id": "02-22", "chapter": "Comparison", "animation_end_frame": 14402}, {"name": "Choose with the traffic in mind", "frame": 14424, "type": "default.normal", "notes": "The right arrangement depends on the traffic. Steady streams may fit fixed allocations, while bursts benefit from serving active sources. Equipment and physical constraints matter too. There isn't one sharing rule that wins in every setting.", "id": "02-23", "chapter": "Comparison", "animation_end_frame": 15058}, {"name": "Retell the separation rule", "frame": 15080, "type": "default.normal", "notes": "The three cameras never needed three separate cables. They needed a separation rule both ends understood. Remember the bands, turns, and wavelengths: sharing works when the receiver can still tell which information belongs to whom.", "id": "02-24", "chapter": "Recap", "animation_end_frame": 15728}], "captions": [[0.0, 7.3, "Three cameras, three streams, one cable. If\nthe signals share the"], [7.3, 14.6, "same path, why don't they become one\nunreadable mess? The answer"], [14.6, 21.899999999999995, "depends on a rule that makes combining them\nreversible."], [21.9, 27.266666666666666, "First separate two ideas. The medium is the\nphysical path; a"], [27.266666666666666, 32.63333333333333, "channel is a way of using that path. One cable\ncan"], [32.63333333333333, 38.0, "support several channels when the equipment\ngives their signals distinguishable places"], [38.0, 43.36666666666667, "or turns."], [43.36666666666667, 50.800000000000004, "At one end, the multiplexer combi const $=id=>document.getElementById(id),film=$('film'),all=deck.sections,fps=deck.fps;
let current=0,state='ready',loaded=false,generation=0,presenter=null,started=false;
const start=i=>all[i].frame/fps;
const finish=i=>((i+1<all.length?all[i+1].frame:deck.frames)-0.5)/fps;
const motionFinish=i=>Math.min(finish(i),(all[i].animation_end_frame??((i+1<all.length?all[i+1].frame:deck.frames)-1))/fps);
const track=film.addTextTrack('captions','Guide captions','en');
for(const [a,b,t] of deck.captions)track.addCue(new VTTCue(a,b,t));
track.mode='hidden';
function sync(){
  const speed=`${film.playbackRate}×`;
  document.title=`${deck.title} · ${current+1}/${all.length} · ${speed}`;
  $('status').textContent=`Scene ${current+1} of ${all.length}: ${all[current].name}. ${state}. Speed ${speed}.`;
  if(presenter&&!presenter.closed){
    const d=presenter.document;
    d.getElementById('section').textContent=`${current+1} / ${all.length} — ${all[current].name}`;
    d.getElementById('script').textContent=all[current].notes;
    d.getElementById('speed').textContent=`Speed: ${speed}`;
    d.getElementById('scenes').value=current;
    d.getElementById('upnext').textContent=current+1<all.length?`Up next: ${all[current+1].name}`:'Final scene';
    const v=d.getElementById('preview');
    if(v.readyState>=1)v.currentTime=Math.min(film.currentTime,finish(current));
  }
}
function choose(i){if(!loaded)return;generation++;film.pause();current=Math.max(0,Math.min(i,all.length-1));state='ready';film.currentTime=finish(current);sync()}
function hold(){if(state!=='playing')return;generation++;film.pause();state='held';film.currentTime=finish(current);sync()}
function check(time){if(state==='playing'&&time>=motionFinish(current)-1/fps)hold()}
function watch(token){if(!film.requestVideoFrameCallback)return;film.requestVideoFrameCallback((_,meta)=>{if(token!==generation||state!=='playing')return;check(meta.mediaTime);if(state==='playing')watch(token)})}
async function run(restart=true){
  if(!loaded)return;
  const token=++generation;
  if(restart)film.currentTime=start(current)+0.5/fps;
  started=true;$('error').hidden=true;state='playing';sync();
  try{await film.play();if(token===generation)watch(token)}catch(e){if(token===generation){state='paused';sync();$('error').hidden=false;$('error').textContent=`Playback could not start: ${e.message}. Press P to retry.`}}
}
function next(){if(!loaded)return;if(!started&&!document.fullscreenElement)fullscreen();if(state!=='ready'){if(current===all.length-1)return;current++}run()}
function pause(){if(state==='playing'){generation++;film.pause();state='paused';sync()}else if(state==='paused')run(false)}
function fullscreen(){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else if($('app').requestFullscreen)$('app').requestFullscreen().catch(()=>{})}
function speed(delta){film.playbackRate=Math.max(.25,Math.min(4,Math.round((film.playbackRate+delta)*4)/4));sync()}
function openPresenter(){
  presenter=window.open('','networks-presenter','width=900,height=760');
  if(!presenter){$('status').textContent='Allow the presenter popup to read the script.';return}
  const d=presenter.document;d.title='Presenter notes — '+deck.title;d.body.replaceChildren();
  const style=d.createElement('style');style.textContent='body{background:#07111f;color:#edf4ff;font:22px/1.65 system-ui;padding:24px}h1{font-size:24px;color:#64d8eb}video{width:100%;max-height:230px;object-fit:contain}p{white-space:pre-wrap}button,select{padding:12px;margin:4px;background:#17334b;color:white;border:1px solid #456;border-radius:8px;font-size:18px}small{color:#9bb3ce}';d.head.append(style);
  const h=d.createElement('h1');h.id='section';d.body.append(h);
  const v=d.createElement('video');v.id='preview';v.src=film.currentSrc||film.src;v.muted=true;d.body.append(v);
  const n=d.createElement('p');n.id='script';d.body.append(n);
  const rate=d.createElement('p');rate.id='speed';d.body.append(rate);
  for(const [text,action] of [['← Previous',()=>choose(current-1)],['Replay',()=>run()],['Pause / Resume',pause],['Next →',next],['Slower ↓',()=>speed(-.25)],['Faster ↑',()=>speed(.25)]]){const b=d.createElement('button');b.textContent=text;b.onclick=action;d.body.append(b)}
  const select=d.createElement('select');select.id='scenes';select.setAttribute('aria-label','Choose scene');
  all.forEach((s,i)=>{const o=d.createElement('option');o.value=i;o.textContent=`${i+1}. ${s.name}`;select.append(o)});
  select.onchange=()=>choose(Number(select.value));d.body.append(select);
  const up=d.createElement('p');up.id='upnext';d.body.append(up);
  const small=d.createElement('small');small.textContent='Main window: video only. → next · ← previous · ↑/↓ speed (0.25× to 4×) · P pause · R replay · F fullscreen · C captions. Speed also appears in the main browser tab title.';d.body.append(small);
  d.addEventListener('keydown',key);v.addEventListener('loadedmetadata',sync,{once:true});sync();
}
function key(e){
  if(e.repeat||['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName))return;
  if(e.target.tagName==='BUTTON'&&[' ','Enter'].includes(e.key))return;
  if(e.shiftKey&&e.key.toLowerCase()==='p'){e.preventDefault();openPresenter();return}
  const actions={' ':next,Enter:next,ArrowRight:next,PageDown:next,ArrowLeft:()=>choose(current-1),PageUp:()=>choose(current-1),ArrowUp:()=>speed(.25),ArrowDown:()=>speed(-.25),r:()=>run(),p:pause,f:fullscreen,c:()=>{track.mode=track.mode==='showing'?'hidden':'showing'},Home:()=>choose(0),End:()=>choose(all.length-1)};
  const action=actions[e.key]||actions[e.key.toLowerCase()];if(action){e.preventDefault();action()}
}
film.onclick=next;
film.addEventListener('loadeddata',()=>{loaded=true;choose(0)},{once:true});
film.addEventListener('timeupdate',()=>check(film.currentTime));film.addEventListener('ended',hold);
film.addEventListener('ratechange',sync);
film.addEventListener('error',()=>{$('error').hidden=false;$('error').textContent='Cannot load episode.mp4. Keep it beside presentation.html, or open this lesson using the local server link in the README.'});
document.addEventListener('keydown',key);sync();
window.lessonState=()=>({current,state,loaded,time:film.currentTime,start:start(current),end:finish(current),motionEnd:motionFinish(current),count:all.length,speed:film.playbackRate});
</script></body></html>
