<script>
"use strict";
const deck={"fps": 30, "frames": 15751, "sections": [{"name": "One click, many conversations", "frame": 0, "type": "default.normal", "notes": "A page appears after one click. But the server could be across an ocean, and your computer started with only a name. How does that tiny action become a complete journey? Follow this request.", "id": "01-01", "chapter": "The puzzle", "animation_end_frame": 610}, {"name": "Choose a clear teaching model", "frame": 632, "type": "default.normal", "notes": "We'll slow down a first visit using HTTP version one point one over TCP. Browsers often reuse earlier work. Leaving those shortcuts aside lets us see the separate decisions hidden inside an ordinary page load.", "id": "01-02", "chapter": "The puzzle", "animation_end_frame": 1254}, {"name": "From LAN to WAN", "frame": 1276, "type": "default.normal", "notes": "Our request first crosses a local network, then enters a chain of other networks. The Internet is this interconnection. No single cable stretches from every browser to every website; routers join the pieces together.", "id": "01-03", "chapter": "The route", "animation_end_frame": 1886}, {"name": "Layers divide the work", "frame": 1908, "type": "default.normal", "notes": "Notice how many different jobs are already appearing. Layers separate those jobs. OSI describes seven; this TCP/IP picture groups them into four. They're different ways to organize responsibilities, rather than physical floors inside the computer.", "id": "01-04", "chapter": "The route", "animation_end_frame": 2542}, {"name": "Ask for an address", "frame": 2565, "type": "default.normal", "notes": "The browser has a name, but packets need an address. DNS supplies that missing link. We ask a resolver to find the address associated with the name, turning something readable into something the network can use.", "id": "01-05", "chapter": "Finding the server", "animation_end_frame": 3186}, {"name": "Follow the DNS hierarchy", "frame": 3209, "type": "default.normal", "notes": "Without a cached answer, the resolver follows referrals: root, top-level domain, then the authoritative server. Each reply narrows the search. No single directory needs to store the complete answer for every name on the Internet.", "id": "01-06", "chapter": "Finding the server", "animation_end_frame": 3832}, {"name": "Reuse a cached answer", "frame": 3854, "type": "default.normal", "notes": "Now repeat the lookup. The saved answer avoids the earlier search, so the path gets shorter. A cache makes previous work useful again, but only within its allowed lifetime. Old directions can eventually become wrong.", "id": "01-07", "chapter": "Finding the server", "animation_end_frame": 4476}, {"name": "Choose the receiving process", "frame": 4498, "type": "default.normal", "notes": "Reaching the right computer is only part of delivery. Which application should receive the data? Ports distinguish endpoints there. Our client uses 49152; the server uses 80. The address and port answer different questions.", "id": "01-08", "chapter": "Transport setup", "animation_end_frame": 5146}, {"name": "Establish a TCP connection", "frame": 5168, "type": "default.normal", "notes": "Before the request, three TCP messages cross the link: SYN, SYN with ACK, then ACK. Each side establishes connection state. The connection is shared agreement between endpoints; the network hasn't reserved a private physical path.", "id": "01-09", "chapter": "Transport setup", "animation_end_frame": 5790}, {"name": "Build the HTTP request", "frame": 5813, "type": "default.normal", "notes": "Now the browser can ask for the resource. GET supplies the HTTP meaning; TCP carries the bytes. Notice the separation: transporting a request successfully doesn't tell us whether the requested page exists.", "id": "01-10", "chapter": "Create the request", "animation_end_frame": 6448}, {"name": "Wrap the application bytes", "frame": 6470, "type": "default.normal", "notes": "Watch the blue message stay inside as new information appears around it. This is encapsulation: each layer adds what its own job needs. A larger message can also be divided across several transport segments.", "id": "01-11", "chapter": "Create the request", "animation_end_frame": 7104}, {"name": "Transport adds its information", "frame": 7127, "type": "default.normal", "notes": "TCP adds ports and sequence information, identifying the conversation and locating bytes within it. The application data remains inside. A boundary between application writes doesn't necessarily become a boundary between segments on the wire.", "id": "01-12", "chapter": "Create the request", "animation_end_frame": 7762}, {"name": "Address the IP packet", "frame": 7785, "type": "default.normal", "notes": "Next come the IP source and destination. Routers can use the destination to choose where the packet goes next. The server remains our goal here, though mechanisms such as address translation can alter addresses.", "id": "01-13", "chapter": "Create the request", "animation_end_frame": 8420}, {"name": "Prepare the local frame", "frame": 8442, "type": "default.normal", "notes": "The outer frame answers a more immediate question: who receives this on the local link? For a distant server, that may be the gateway. The next local destination and the final IP destination serve different purposes.", "id": "01-14", "chapter": "Create the request", "animation_end_frame": 9102}, {"name": "Turn bits into signals", "frame": 9125, "type": "default.normal", "notes": "All those headers and bytes must now become a physical signal. Copper, fiber, and radio do this differently. The travelling marks represent changing signals, not tiny printed digits being pushed through a cable.", "id": "01-15", "chapter": "Cross the network", "animation_end_frame": 9760}, {"name": "The switch forwards a frame", "frame": 9783, "type": "default.normal", "notes": "At the switch, the frame takes a local turn based on MAC forwarding information. Watch the selected output. This decision moves data within the local network; it doesn't calculate the entire route to the website.", "id": "01-16", "chapter": "Cross the network", "animation_end_frame": 10430}, {"name": "The router chooses a next hop", "frame": 10453, "type": "default.normal", "notes": "The router removes the incoming frame and examines the IP destination. It chooses a next hop without needing to interpret GET. A useful network can move many kinds of application data using the same forwarding machinery.", "id": "01-17", "chapter": "Cross the network", "animation_end_frame": 11088}, {"name": "New frame, continuing packet", "frame": 11110, "type": "default.normal", "notes": "Here is the detail to watch: the local frame changes, while our request continues toward the server. Each routed hop gets its own link information. One journey is being carried through several separate local deliveries.", "id": "01-18", "chapter": "Cross the network", "animation_end_frame": 11744}, {"name": "Shared links can queue or lose", "frame": 11767, "type": "default.normal", "notes": "A shared outgoing link creates a bottleneck. Packets arrive faster than it can send them, so a queue grows. When the buffer fills, packets may be dropped. Connectivity alone doesn't promise immediate or successful delivery.", "id": "01-19", "chapter": "Cross the network", "animation_end_frame": 12402}, {"name": "Unwrap at the server", "frame": 12425, "type": "default.normal", "notes": "At the server, the wrapping comes off in stages: link, IP, TCP, then HTTP. Each layer handles its own information and passes the useful contents upward. The application finally receives the request we started with.", "id": "01-20", "chapter": "At the destination", "animation_end_frame": 13060}, {"name": "Send an HTTP response", "frame": 13082, "type": "default.normal", "notes": "The server returns status information and content. Those bytes need the same layered delivery in reverse. But reverse doesn't require an identical route: the response can cross a different sequence of networks on its way back.", "id": "01-21", "chapter": "At the destination", "animation_end_frame": 13756}, {"name": "A page can trigger more requests", "frame": 13778, "type": "default.normal", "notes": "That response may contain instructions to fetch images, styles, and other resources. So one apparent page load becomes several conversations, sometimes involving other servers or caches. The first arrival starts another round of work.", "id": "01-22", "chapter": "At the destination", "animation_end_frame": 14412}, {"name": "Add the modern distinctions", "frame": 14435, "type": "default.normal", "notes": "Our example used HTTP over TCP. HTTPS adds TLS protection, while HTTP version three uses QUIC over UDP. Different protocols can fill these roles, but the underlying questions about names, endpoints, and delivery still remain.", "id": "01-23", "chapter": "Reality check", "animation_end_frame": 15070}, {"name": "Retell the whole journey", "frame": 15093, "type": "default.normal", "notes": "Return to the opening click. A name became an address, bytes gained headers, and routers connected local steps into one journey. The remarkable part is how many small agreements cooperate to produce something that feels immediate.", "id": "01-24", "chapter": "Recap", "animation_end_frame": 15728}], "captions": [[0.0, 5.266666666666667, "A page appears after one click. But the server\ncould be"], [5.266666666666667, 10.533333333333333, "across an ocean, and your computer started\nwith only a name."], [10.533333333333333, 15.8, "How does that tiny action become a complete\njourney? Follow this"], [15.8, 21.066666666666666, "request."], [21.066666666666666, 26.433333333333334, "We'll slow down a first visit using HTTP\nversion one point"], [26.433333333333334, 31.799999999999997, "one over TCP. Browsers often reuse earlier\nwork. Leaving those shortcuts"], [31.799999999999997, 37.166666666666664, "aside lets us see the separate decisions\nhidden , 503.1, "still remain."], [503.1, 508.57500000000005, "Return to the opening click. A name became an\naddress, bytes"], [508.57500000000005, 514.05, "gained headers, and routers connected local\nsteps into one journey. The"], [514.05, 519.525, "remarkable part is how many small agreements\ncooperate to produce something"], [519.525, 525.0, "that feels immediate."]], "title": "What Happens When You Open a Website?"};
const $=id=>document.getElementById(id),film=$('film'),all=deck.sections,fps=deck.fps;
let current=0,state='ready',loaded=false,generation=0,presenter=null,started=false;
const start=i=>all[i].frame/fps;
const finish=i=>((i+1<all.length?all[i+1].frame:deck.frames)-0.5)/fps;
const motionFinish=i=>Math.min(finish(i),(all[i].animation_end_frame??((i+1<all.length?all[i+1].frame:deck.frames)-1))/fps);
const track=film.addTextTrack('captions','Guide captions','en');
for(const [a,b,t] of deck.captions)track.addCue(new VTTCue(a,b,t));
track.mode='hidden';
function sync(){
  const speed=`${film.playbackRate}×`;
  document.title=`${deck.title} · ${current+1}/${all.length} · ${speed}`;
  $('status').textContent=`Scene ${current+1} of ${all.length}: ${all[current].name}. ${state}. Speed ${speed}.`;
  if(presenter&&!presenter.closed){
    const d=presenter.document;
    d.getElementById('section').textContent=`${current+1} / ${all.length} — ${all[current].name}`;
    d.getElementById('script').textContent=all[current].notes;
    d.getElementById('speed').textContent=`Speed: ${speed}`;
    d.getElementById('scenes').value=current;
    d.getElementById('upnext').textContent=current+1<all.length?`Up next: ${all[current+1].name}`:'Final scene';
    const v=d.getElementById('preview');
    if(v.readyState>=1)v.currentTime=Math.min(film.currentTime,finish(current));
  }
}
function choose(i){if(!loaded)return;generation++;film.pause();current=Math.max(0,Math.min(i,all.length-1));state='ready';film.currentTime=finish(current);sync()}
function hold(){if(state!=='playing')return;generation++;film.pause();state='held';film.currentTime=finish(current);sync()}
function check(time){if(state==='playing'&&time>=motionFinish(current)-1/fps)hold()}
function watch(token){if(!film.requestVideoFrameCallback)return;film.requestVideoFrameCallback((_,meta)=>{if(token!==generation||state!=='playing')return;check(meta.mediaTime);if(state==='playing')watch(token)})}
async function run(restart=true){
  if(!loaded)return;
  const token=++generation;
  if(restart)film.currentTime=start(current)+0.5/fps;
  started=true;$('error').hidden=true;state='playing';sync();
  try{await film.play();if(token===generation)watch(token)}catch(e){if(token===generation){state='paused';sync();$('error').hidden=false;$('error').textContent=`Playback could not start: ${e.message}. Press P to retry.`}}
}
function next(){if(!loaded)return;if(!started&&!document.fullscreenElement)fullscreen();if(state!=='ready'){if(current===all.length-1)return;current++}run()}
function pause(){if(state==='playing'){generation++;film.pause();state='paused';sync()}else if(state==='paused')run(false)}
function fullscreen(){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else if($('app').requestFullscreen)$('app').requestFullscreen().catch(()=>{})}
function speed(delta){film.playbackRate=Math.max(.25,Math.min(4,Math.round((film.playbackRate+delta)*4)/4));sync()}
function openPresenter(){
  presenter=window.open('','networks-presenter','width=900,height=760');
  if(!presenter){$('status').textContent='Allow the presenter popup to read the script.';return}
  const d=presenter.document;d.title='Presenter notes — '+deck.title;d.body.replaceChildren();
  const style=d.createElement('style');style.textContent='body{background:#07111f;color:#edf4ff;font:22px/1.65 system-ui;padding:24px}h1{font-size:24px;color:#64d8eb}video{width:100%;max-height:230px;object-fit:contain}p{white-space:pre-wrap}button,select{padding:12px;margin:4px;background:#17334b;color:white;border:1px solid #456;border-radius:8px;font-size:18px}small{color:#9bb3ce}';d.head.append(style);
  const h=d.createElement('h1');h.id='section';d.body.append(h);
  const v=d.createElement('video');v.id='preview';v.src=film.currentSrc||film.src;v.muted=true;d.body.append(v);
  const n=d.createElement('p');n.id='script';d.body.append(n);
  const rate=d.createElement('p');rate.id='speed';d.body.append(rate);
  for(const [text,action] of [['← Previous',()=>choose(current-1)],['Replay',()=>run()],['Pause / Resume',pause],['Next →',next],['Slower ↓',()=>speed(-.25)],['Faster ↑',()=>speed(.25)]]){const b=d.createElement('button');b.textContent=text;b.onclick=action;d.body.append(b)}
  const select=d.createElement('select');select.id='scenes';select.setAttribute('aria-label','Choose scene');
  all.forEach((s,i)=>{const o=d.createElement('option');o.value=i;o.textContent=`${i+1}. ${s.name}`;select.append(o)});
  select.onchange=()=>choose(Number(select.value));d.body.append(select);
  const up=d.createElement('p');up.id='upnext';d.body.append(up);
  const small=d.createElement('small');small.textContent='Main window: video only. → next · ← previous · ↑/↓ speed (0.25× to 4×) · P pause · R replay · F fullscreen · C captions. Speed also appears in the main browser tab title.';d.body.append(small);
  d.addEventListener('keydown',key);v.addEventListener('loadedmetadata',sync,{once:true});sync();
}
function key(e){
  if(e.repeat||['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName))return;
  if(e.target.tagName==='BUTTON'&&[' ','Enter'].includes(e.key))return;
  if(e.shiftKey&&e.key.toLowerCase()==='p'){e.preventDefault();openPresenter();return}
  const actions={' ':next,Enter:next,ArrowRight:next,PageDown:next,ArrowLeft:()=>choose(current-1),PageUp:()=>choose(current-1),ArrowUp:()=>speed(.25),ArrowDown:()=>speed(-.25),r:()=>run(),p:pause,f:fullscreen,c:()=>{track.mode=track.mode==='showing'?'hidden':'showing'},Home:()=>choose(0),End:()=>choose(all.length-1)};
  const action=actions[e.key]||actions[e.key.toLowerCase()];if(action){e.preventDefault();action()}
}
film.onclick=next;
film.addEventListener('loadeddata',()=>{loaded=true;choose(0)},{once:true});
film.addEventListener('timeupdate',()=>check(film.currentTime));film.addEventListener('ended',hold);
film.addEventListener('ratechange',sync);
film.addEventListener('error',()=>{$('error').hidden=false;$('error').textContent='Cannot load episode.mp4. Keep it beside presentation.html, or open this lesson using the local server link in the README.'});
document.addEventListener('keydown',key);sync();
window.lessonState=()=>({current,state,loaded,time:film.currentTime,start:start(current),end:finish(current),motionEnd:motionFinish(current),count:all.length,speed:film.playbackRate});
