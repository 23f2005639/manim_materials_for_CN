<script>
"use strict";
const deck={"fps": 30, "frames": 16351, "sections": [{"name": "One medium, several speakers", "frame": 0, "type": "default.normal", "notes": "Several devices share a medium, but none can instantly know what every other device is doing. When may one transmit? This local coordination problem lies behind access protocols, and the answer begins with a collision.", "id": "04-01", "chapter": "The puzzle", "animation_end_frame": 636}, {"name": "Make overlap visible", "frame": 658, "type": "default.normal", "notes": "A and C start before either hears the other. Their signals overlap, making these transmissions fail. Watch the red disturbance spread. The useful question is how each station learns enough to decide what happens next.", "id": "04-02", "chapter": "The puzzle", "animation_end_frame": 1332}, {"name": "Pure ALOHA: send when ready", "frame": 1355, "type": "default.normal", "notes": "Begin with almost no coordination. Pure ALOHA lets a station send whenever data is ready. Simplicity comes at a cost: another transmission can overlap at many different starting times, forcing failed attempts to be repeated.", "id": "04-03", "chapter": "ALOHA", "animation_end_frame": 2016}, {"name": "A vulnerable interval of 2T", "frame": 2039, "type": "default.normal", "notes": "Let a frame last T. Another frame can interfere if it starts within T before our start, or T afterward. Slide those possibilities together: the vulnerable interval spans two T, twice the frame's duration.", "id": "04-04", "chapter": "ALOHA", "animation_end_frame": 2688}, {"name": "Why retry randomly?", "frame": 2710, "type": "default.normal", "notes": "If colliding stations wait exactly the same time, they can collide again on the retry. Random waits break that symmetry. They're no guarantee for an individual attempt, but reduce the chance of repeating the same overlap.", "id": "04-05", "chapter": "ALOHA", "animation_end_frame": 3358}, {"name": "Slotted ALOHA adds boundaries", "frame": 3381, "type": "default.normal", "notes": "Now mark shared starting boundaries. Slotted ALOHA permits transmission only at those boundaries, with frames fitting the slots. Stations can still choose the same slot, but arbitrary partial overlaps no longer create additional collision opportunities.", "id": "04-06", "chapter": "ALOHA", "animation_end_frame": 4042}, {"name": "The vulnerable interval becomes T", "frame": 4065, "type": "default.normal", "notes": "Watch the vulnerable interval shrink. Only another attempt in the same slot conflicts with this frame. Coordinating the starts reduces the interval from two T to T, without changing the physical transmission rate.", "id": "04-07", "chapter": "ALOHA", "animation_end_frame": 4726}, {"name": "Interpret the ideal efficiency result", "frame": 4749, "type": "default.normal", "notes": "In the ideal model, pure ALOHA peaks near eighteen point four percent throughput; slotted ALOHA near thirty-six point eight. Push attempts past the peak and collisions dominate. More activity can actually produce less useful delivery.", "id": "04-08", "chapter": "ALOHA", "animation_end_frame": 5384}, {"name": "Scheduling or contention?", "frame": 5407, "type": "default.normal", "notes": "There are two broad ways to organize access: assign turns, or let stations compete under shared rules. A schedule needs coordination; contention needs a way to handle conflicting attempts. Both must divide finite capacity.", "id": "04-09", "chapter": "ALOHA", "animation_end_frame": 6068}, {"name": "Listen before transmitting", "frame": 6091, "type": "default.normal", "notes": "What if we listen first? Carrier sensing lets a station check whether the medium appears busy before transmitting. That information avoids some blind collisions, but a quiet local observation isn't perfect knowledge of the whole network.", "id": "04-10", "chapter": "Carrier sensing", "animation_end_frame": 6752}, {"name": "A distant sender can still start", "frame": 6775, "type": "default.normal", "notes": "Here is the remaining problem: signals take time to travel. A distant station can start while the first signal is still approaching it. Both hear silence, both transmit, and neither has broken the listening rule.", "id": "04-11", "chapter": "Carrier sensing", "animation_end_frame": 7463}, {"name": "One-persistent CSMA", "frame": 7485, "type": "default.normal", "notes": "One-persistent CSMA listens continuously and transmits as soon as the channel becomes idle. That eagerness limits waiting, but several waiting stations can react to the same silence together, producing another collision at the restart.", "id": "04-12", "chapter": "Carrier sensing", "animation_end_frame": 8146}, {"name": "Nonpersistent CSMA", "frame": 8169, "type": "default.normal", "notes": "Nonpersistent CSMA waits a random interval after finding the channel busy, then checks again. Restart attempts become less synchronized. The trade-off is visible in the empty gap: everyone might still be waiting after the medium becomes free.", "id": "04-13", "chapter": "Carrier sensing", "animation_end_frame": 8818}, {"name": "P-persistent CSMA", "frame": 8840, "type": "default.normal", "notes": "In a suitable slotted setting, p-persistent CSMA makes sending probabilistic. On an idle slot, transmit with probability p or defer. Adjusting that chance spreads competing attempts, balancing prompt use against the risk of simultaneous starts.", "id": "04-14", "chapter": "Carrier sensing", "animation_end_frame": 9488}, {"name": "Add detection on historical Ethernet", "frame": 9511, "type": "default.normal", "notes": "For the next mechanism, keep one historical setting in mind: shared, half-duplex Ethernet. CSMA/CD senses before sending and detects collisions during transmission. These rules describe that shared medium, rather than every Ethernet or wireless connection.", "id": "04-15", "chapter": "Collision detection", "animation_end_frame": 10146}, {"name": "Detect, abort, and signal", "frame": 10169, "type": "default.normal", "notes": "After detecting a collision, stop the frame, signal the collision with a jam, and back off. An unsuccessful transmission ends before wasting a whole frame. The stations then use different retry delays to separate their next attempts.", "id": "04-16", "chapter": "Collision detection", "animation_end_frame": 10856}, {"name": "Why propagation affects frame length", "frame": 10878, "type": "default.normal", "notes": "A far-end collision needs time to become visible at the sender. The sender must still be transmitting when that indication returns. That's why minimum frame duration and the network's round-trip propagation delay are connected.", "id": "04-17", "chapter": "Collision detection", "animation_end_frame": 11552}, {"name": "Widen the random retry range", "frame": 11575, "type": "default.normal", "notes": "After repeated collisions, widen the random range: two choices, then four, then eight. Binary exponential backoff gives competing attempts more room to spread. It changes the distribution of waits, rather than guaranteeing a dedicated turn.", "id": "04-18", "chapter": "Backoff", "animation_end_frame": 12236}, {"name": "Work two retry choices", "frame": 12259, "type": "default.normal", "notes": "After the first collision, choose zero or one slot; after the second, zero through three. Follow the two choices in the picture. Different selections create different retry times, reducing the chance of another synchronized failure.", "id": "04-19", "chapter": "Worked example", "animation_end_frame": 12933}, {"name": "Backoff does not reserve the cable", "frame": 12956, "type": "default.normal", "notes": "A completed backoff doesn't reserve the medium. Another station may already be transmitting when the wait ends. The sender still follows the channel rules. A timer tells it when to try, not that success is guaranteed.", "id": "04-20", "chapter": "Backoff", "animation_end_frame": 13630}, {"name": "Modern switched full duplex", "frame": 13653, "type": "default.normal", "notes": "Now replace the shared wire with switched full-duplex links. Separate sending and receiving paths allow opposite flows together. The old shared-medium collision mechanism no longer applies on these links, and CSMA/CD isn't used there.", "id": "04-21", "chapter": "Modern distinctions", "animation_end_frame": 14328}, {"name": "Wi-Fi needs different feedback", "frame": 14350, "type": "default.normal", "notes": "Wi-Fi faces different observation limits. A station doesn't simply detect collisions during transmission in Ethernet's way. Contention, avoidance rules, and acknowledgments help coordinate access when different stations may hear different parts of the wireless network.", "id": "04-22", "chapter": "Modern distinctions", "animation_end_frame": 14998}, {"name": "Compare the added knowledge", "frame": 15021, "type": "default.normal", "notes": "Compare what each station knows. ALOHA sends; CSMA first senses; CSMA/CD also detects collisions in its shared-wire setting. Adding information changes the rules, while propagation delay still limits how quickly that information can arrive.", "id": "04-23", "chapter": "Comparison", "animation_end_frame": 15670}, {"name": "Explain the next collision", "frame": 15692, "type": "default.normal", "notes": "Return to the collision. Ask what each sender could hear, when it could start, and how it chooses a retry. Those three questions turn a list of protocol names into understandable responses to one shared-medium problem.", "id": "04-24", "chapter": "Recap", "animation_end_frame": 16328}], "captions": [[0.0, 5.483333333333333, "Several devices share a medium, but none can\ninstantly know what"], [5.483333333333333, 10.966666666666667, "every other device is doing. When may one\ntransmit? This local"], [10.966666666666667, 16.45, "coordination problem lies behind access\nprotocols, and the answer begins with"], [16.45, 21.933333333333334, "a collision."], [21.933333333333334, 27.741666666666667, "A and C star A sends;\nCSMA first senses; CSMA/CD"], [506.2916666666667, 511.8833333333333, "also detects collisions in its shared-wire\nsetting. Adding information changes the"], [511.8833333333333, 517.475, "rules, while propagation delay still limits\nhow quickly that information can"], [517.475, 523.0666666666667, "arrive."], [523.0666666666667, 528.5500000000001, "Return to the collision. Ask what each sender\ncould hear, when"], [528.5500000000001, 534.0333333333333, "it could start, and how it chooses a retry.\nThose three"], [534.0333333333333, 539.5166666666667, "questions turn a list of protocol names into\nunderstandable responses to"], [539.5166666666667, 545.0, "one shared-medium problem."]], "title": "When Computers Talk at Once"};
const $=id=>document.getElementById(id),film=$('film'),all=deck.sections,fps=deck.fps;
let current=0,state='ready',loaded=false,generation=0,presenter=null,started=false;
const start=i=>all[i].frame/fps;
const finish=i=>((i+1<all.length?all[i+1].frame:deck.frames)-0.5)/fps;
const motionFinish=i=>Math.min(finish(i),(all[i].animation_end_frame??((i+1<all.length?all[i+1].frame:deck.frames)-1))/fps);
const track=film.addTextTrack('captions','Guide captions','en');
for(const [a,b,t] of deck.captions)track.addCue(new VTTCue(a,b,t));
track.mode='hidden';
function sync(){
  const speed=`${film.playbackRate}×`;
  document.title=`${deck.title} · ${current+1}/${all.length} · ${speed}`;
  $('status').textContent=`Scene ${current+1} of ${all.length}: ${all[current].name}. ${state}. Speed ${speed}.`;
  if(presenter&&!presenter.closed){
    const d=presenter.document;
    d.getElementById('section').textContent=`${current+1} / ${all.length} — ${all[current].name}`;
    d.getElementById('script').textContent=all[current].notes;
    d.getElementById('speed').textContent=`Speed: ${speed}`;
    d.getElementById('scenes').value=current;
    d.getElementById('upnext').textContent=current+1<all.length?`Up next: ${all[current+1].name}`:'Final scene';
    const v=d.getElementById('preview');
    if(v.readyState>=1)v.currentTime=Math.min(film.currentTime,finish(current));
  }
}
function choose(i){if(!loaded)return;generation++;film.pause();current=Math.max(0,Math.min(i,all.length-1));state='ready';film.currentTime=finish(current);sync()}
function hold(){if(state!=='playing')return;generation++;film.pause();state='held';film.currentTime=finish(current);sync()}
function check(time){if(state==='playing'&&time>=motionFinish(current)-1/fps)hold()}
function watch(token){if(!film.requestVideoFrameCallback)return;film.requestVideoFrameCallback((_,meta)=>{if(token!==generation||state!=='playing')return;check(meta.mediaTime);if(state==='playing')watch(token)})}
async function run(restart=true){
  if(!loaded)return;
  const token=++generation;
  if(restart)film.currentTime=start(current)+0.5/fps;
  started=true;$('error').hidden=true;state='playing';sync();
  try{await film.play();if(token===generation)watch(token)}catch(e){if(token===generation){state='paused';sync();$('error').hidden=false;$('error').textContent=`Playback could not start: ${e.message}. Press P to retry.`}}
}
function next(){if(!loaded)return;if(!started&&!document.fullscreenElement)fullscreen();if(state!=='ready'){if(current===all.length-1)return;current++}run()}
function pause(){if(state==='playing'){generation++;film.pause();state='paused';sync()}else if(state==='paused')run(false)}
function fullscreen(){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else if($('app').requestFullscreen)$('app').requestFullscreen().catch(()=>{})}
function speed(delta){film.playbackRate=Math.max(.25,Math.min(4,Math.round((film.playbackRate+delta)*4)/4));sync()}
function openPresenter(){
  presenter=window.open('','networks-presenter','width=900,height=760');
  if(!presenter){$('status').textContent='Allow the presenter popup to read the script.';return}
  const d=presenter.document;d.title='Presenter notes — '+deck.title;d.body.replaceChildren();
  const style=d.createElement('style');style.textContent='body{background:#07111f;color:#edf4ff;font:22px/1.65 system-ui;padding:24px}h1{font-size:24px;color:#64d8eb}video{width:100%;max-height:230px;object-fit:contain}p{white-space:pre-wrap}button,select{padding:12px;margin:4px;background:#17334b;color:white;border:1px solid #456;border-radius:8px;font-size:18px}small{color:#9bb3ce}';d.head.append(style);
  const h=d.createElement('h1');h.id='section';d.body.append(h);
  const v=d.createElement('video');v.id='preview';v.src=film.currentSrc||film.src;v.muted=true;d.body.append(v);
  const n=d.createElement('p');n.id='script';d.body.append(n);
  const rate=d.createElement('p');rate.id='speed';d.body.append(rate);
  for(const [text,action] of [['← Previous',()=>choose(current-1)],['Replay',()=>run()],['Pause / Resume',pause],['Next →',next],['Slower ↓',()=>speed(-.25)],['Faster ↑',()=>speed(.25)]]){const b=d.createElement('button');b.textContent=text;b.onclick=action;d.body.append(b)}
  const select=d.createElement('select');select.id='scenes';select.setAttribute('aria-label','Choose scene');
  all.forEach((s,i)=>{const o=d.createElement('option');o.value=i;o.textContent=`${i+1}. ${s.name}`;select.append(o)});
  select.onchange=()=>choose(Number(select.value));d.body.append(select);
  const up=d.createElement('p');up.id='upnext';d.body.append(up);
  const small=d.createElement('small');small.textContent='Main window: video only. → next · ← previous · ↑/↓ speed (0.25× to 4×) · P pause · R replay · F fullscreen · C captions. Speed also appears in the main browser tab title.';d.body.append(small);
  d.addEventListener('keydown',key);v.addEventListener('loadedmetadata',sync,{once:true});sync();
}
function key(e){
  if(e.repeat||['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName))return;
  if(e.target.tagName==='BUTTON'&&[' ','Enter'].includes(e.key))return;
  if(e.shiftKey&&e.key.toLowerCase()==='p'){e.preventDefault();openPresenter();return}
  const actions={' ':next,Enter:next,ArrowRight:next,PageDown:next,ArrowLeft:()=>choose(current-1),PageUp:()=>choose(current-1),ArrowUp:()=>speed(.25),ArrowDown:()=>speed(-.25),r:()=>run(),p:pause,f:fullscreen,c:()=>{track.mode=track.mode==='showing'?'hidden':'showing'},Home:()=>choose(0),End:()=>choose(all.length-1)};
  const action=actions[e.key]||actions[e.key.toLowerCase()];if(action){e.preventDefault();action()}
}
film.onclick=next;
film.addEventListener('loadeddata',()=>{loaded=true;choose(0)},{once:true});
film.addEventListener('timeupdate',()=>check(film.currentTime));film.addEventListener('ended',hold);
film.addEventListener('ratechange',sync);
film.addEventListener('error',()=>{$('error').hidden=false;$('error').textContent='Cannot load episode.mp4. Keep it beside presentation.html, or open this lesson using the local server link in the README.'});
document.addEventListener('keydown',key);sync();
window.lessonState=()=>({current,state,loaded,time:film.currentTime,start:start(current),end:finish(current),motionEnd:motionFinish(current),count:all.length,speed:film.playbackRate});
</script></body></html>
