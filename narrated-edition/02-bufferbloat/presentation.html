<script>
"use strict";
const deck={"fps": 30, "frames": 14388, "sections": [{"name": "You tap send", "id": "02-01", "frame": 0, "animation_end_frame": 891, "notes": "A message takes a fraction of a second to type. So why can a tiny message feel stuck on a fast connection? Let's build the journey from one green box. Let's slow that tiny journey down. Here is your computer, here is your friend's, and here is a connection between them. A network is simply connected devices that exchange information. The message travels as small pieces of data, called packets. We will draw one as a green box. What could make such a little thing arrive late?", "type": "default.normal", "chapter": "Narrated lesson"}, {"name": "One shared doorway", "id": "02-02", "frame": 892, "animation_end_frame": 1569, "notes": "Between our two computers sits a router: a device that passes packets toward the next part of their journey. Several packets may need the same outgoing connection, or link. Picture a doorway that serves one packet after another. Arrive while it is busy, and you wait. The router has memory for that waiting data. That space is called a buffer; the waiting line is a queue.", "type": "default.normal", "chapter": "Narrated lesson"}, {"name": "Count what leaves", "id": "02-03", "frame": 1570, "animation_end_frame": 2324, "notes": "Now watch the door. It cannot send all the waiting data at once. Computers represent data using zeros and ones. Each zero or one is a bit. A link's rate tells us how many bits it can send each second. More bits per second means more data gets through. Think of counting people leaving a cinema. It does not yet tell us how long one person waited before reaching it.", "type": "default.normal", "chapter": "Narrated lesson"}, {"name": "An empty line", "id": "02-04", "frame": 2325, "animation_end_frame": 3319, "notes": "Start with an empty waiting room. Our green packet arrives and takes its turn almost straight away. It still needs time to be sent and to travel, so the journey is not instant. But there is almost nothing waiting ahead of it. Send another small message and the same thing happens. This is the experience we want when pressing a button or talking on a call: a small action gets a quick response. Now let's make the connection busy.", "type": "default.normal", "chapter": "Narrated lesson"}, {"name": "A line starts growing", "id": "02-05", "frame": 3320, "animation_end_frame": 4139, "notes": "Imagine a large download arriving as lots of blue packets. For a while, they reach our doorway faster than it can send them onward. One leaves, but more join. A line builds up. The exit keeps working, which looks great on a download counter. Yet look inside the waiting room. That pile is growing. We have changed the amount of waiting without making the doorway any narrower. This is the clue that a speed test can miss.", "type": "default.normal", "chapter": "Narrated lesson"}, {"name": "Little message, long wait", "id": "02-06", "frame": 4140, "animation_end_frame": 5046, "notes": "Send the green message again. It is just as small as before. But this time, blue packets got here first. In our simple first-come, first-served line, green must wait behind them. Being small helps with its own turn at the door; it does not erase everybody else's turn. A download can keep moving while your call feels late. Two things are happening at once: plenty of data is leaving, and one particular packet is spending too long waiting.", "type": "default.normal", "chapter": "Narrated lesson"}, {"name": "More room, same door", "id": "02-07", "frame": 5047, "animation_end_frame": 5868, "notes": "Here is a tempting fix: make the waiting room bigger. Surely more space means a better connection? Watch carefully. The room expands, but the door stays exactly the same. It still sends the same number of bits each second. Extra memory lets more packets wait inside. It does not make their turns finish sooner. A bigger room can be useful for a short rush. But if we keep it full, we have built a longer wait, not a faster exit.", "type": "default.normal", "chapter": "Narrated lesson"}, {"name": "Amount divided by rate", "id": "02-08", "frame": 5869, "animation_end_frame": 6621, "notes": "We can measure that wait using an everyday idea. If ten people are ahead of you and two leave each second, clearing the line takes five seconds. Data works the same way in our model. Take the number of bits ahead and divide by the number leaving each second. We call those quantities Q and R, so the shorthand is Q divided by R. The letters add nothing mysterious. They stand for how much is waiting and how fast it leaves.", "type": "default.normal", "chapter": "Narrated lesson"}, {"name": "Eight bits make a byte", "id": "02-09", "frame": 6622, "animation_end_frame": 7484, "notes": "Before using real numbers, we need one small unit check. A byte is a group of eight bits. Files are often measured in bytes, while connection rates are often given in bits per second. Our waiting data is one megabyte. Here, mega means one million, so that is one million bytes. Expand each byte into eight bits and we get eight million bits. Now both our waiting amount and our outgoing rate can use the same unit. The division will make sense.", "type": "default.normal", "chapter": "Narrated lesson"}, {"name": "Four tenths of a second", "id": "02-10", "frame": 7485, "animation_end_frame": 8879, "notes": "Our exit sends twenty million bits each second. There are eight million bits ahead of green. Divide eight million by twenty million: zero point four seconds. That is four hundred milliseconds, because a second contains one thousand milliseconds. Watch eight blocks leave; each block represents one million bits, not one normal packet. Every block adds fifty milliseconds. By the eighth, four hundred milliseconds have passed before green can start its own turn. A short message can inherit a surprisingly long delay.", "type": "default.normal", "chapter": "Narrated lesson"}, {"name": "Waiting is one part", "id": "02-11", "frame": 8880, "animation_end_frame": 9656, "notes": "That four hundred milliseconds is only the wait at this doorway. Signals also need time to travel. Devices need time to examine data, and putting a packet onto a link takes time too. A reply must make a journey back. Those other delays have not vanished; we simply left them out while measuring this one queue. The important point is visible in the bar: a large waiting line can add a big chunk of delay to an otherwise working connection.", "type": "default.normal", "chapter": "Narrated lesson"}, {"name": "A busy line can stay long", "id": "02-12", "frame": 9657, "animation_end_frame": 10619, "notes": "Perhaps the line will fix itself once arrivals slow down. Let's test that. One packet leaves, and one new packet joins. Another leaves, another joins. Count the boxes. The line stays the same length. Equal arrivals and departures stop the queue from growing, but they do not make an existing queue disappear. To shrink it, more data must leave than arrives for a while. The door can work perfectly steadily while every new message still finds a line ahead.", "type": "default.normal", "chapter": "Narrated lesson"}, {"name": "A rush can clear", "id": "02-13", "frame": 10620, "animation_end_frame": 11576, "notes": "Now try a brief rush followed by a quiet moment. Blue packets arrive together, wait briefly, and drain away. When green arrives later, the doorway is clear again. That is useful buffering: the room absorbed uneven arrivals. The problem is a line that stays large, delaying message after message. So we should not treat every waiting packet as a disaster. A short queue during a rush and a standing queue all evening are very different experiences, even with the same doorway.", "type": "default.normal", "chapter": "Narrated lesson"}, {"name": "No room for another packet", "id": "02-14", "frame": 11577, "animation_end_frame": 12451, "notes": "Our waiting room is not endless. Fill every space, then bring in another packet. There may be nowhere to put it, so the device discards it. That is packet loss. Waiting and being discarded are different problems: one packet arrives late, another does not arrive through this attempt. A larger room may delay the moment it fills, while also allowing longer waits. Real devices can manage their queues more carefully. Our drawing explains why simply adding storage is not enough.", "type": "default.normal", "chapter": "Narrated lesson"}, {"name": "Shorter line, quicker response", "id": "02-15", "frame": 12452, "animation_end_frame": 13488, "notes": "Compare these two doors. Both send data at the same rate. The top has a long standing queue; the bottom has a shorter one. Watch the blue packets already ahead leave first in both rows. Green gets its turn much earlier in the shorter line. It has not jumped the queue, and the door has not become faster. This is what better queue management aims to improve: keep the connection useful while avoiding a big pile of data that waits unnecessarily.", "type": "default.normal", "chapter": "Narrated lesson"}, {"name": "Fast can still feel slow", "id": "02-16", "frame": 13489, "animation_end_frame": 14387, "notes": "Now the name makes sense. Bufferbloat is excessive delay caused by too much data sitting in buffers when a connection is busy. Throughput means how much data gets through; delay means how long something takes. A connection can have good throughput and still respond slowly. Bufferbloat is one possible cause of lag, not the answer to every connection problem. Next time a download looks fast but a conversation feels late, remember our green box. How much is waiting in front of it?", "type": "default.normal", "chapter": "Narrated lesson"}], "captions": [[0.3, 3.517777777777778, "A message takes a fraction of a second to type."], [3.517777777777778, 6.735555555555556, "So why can a tiny message feel stuck on a"], [6.735555555555556, 9.953333333333333, "fast connection? Let's build th const $=id=>document.getElementById(id),film=$('film'),all=deck.sections,fps=deck.fps;
let current=0,state='ready',loaded=false,generation=0,presenter=null,started=false;
const start=i=>all[i].frame/fps;
const finish=i=>((i+1<all.length?all[i+1].frame:deck.frames)-0.5)/fps;
const motionFinish=i=>Math.min(finish(i),(all[i].animation_end_frame??((i+1<all.length?all[i+1].frame:deck.frames)-1))/fps);
const track=film.addTextTrack('captions','Guide captions','en');
for(const [a,b,t] of deck.captions)track.addCue(new VTTCue(a,b,t));
track.mode='hidden';
function sync(){
  const speed=`${film.playbackRate}×`;
  document.title=`${deck.title} · ${current+1}/${all.length} · ${speed}`;
  $('status').textContent=`Scene ${current+1} of ${all.length}: ${all[current].name}. ${state}. Speed ${speed}.`;
  if(presenter&&!presenter.closed){
    const d=presenter.document;
    d.getElementById('section').textContent=`${current+1} / ${all.length} — ${all[current].name}`;
    d.getElementById('script').textContent=all[current].notes;
    d.getElementById('speed').textContent=`Speed: ${speed}`;
    d.getElementById('scenes').value=current;
    d.getElementById('upnext').textContent=current+1<all.length?`Up next: ${all[current+1].name}`:'Final scene';
    const v=d.getElementById('preview');
    if(v.readyState>=1)v.currentTime=Math.min(film.currentTime,finish(current));
  }
}
function choose(i){if(!loaded)return;generation++;film.pause();current=Math.max(0,Math.min(i,all.length-1));state='ready';film.currentTime=finish(current);sync()}
function hold(){if(state!=='playing')return;generation++;film.pause();state='held';film.currentTime=finish(current);sync()}
function check(time){if(state==='playing'&&time>=motionFinish(current)-1/fps)hold()}
function watch(token){if(!film.requestVideoFrameCallback)return;film.requestVideoFrameCallback((_,meta)=>{if(token!==generation||state!=='playing')return;check(meta.mediaTime);if(state==='playing')watch(token)})}
async function run(restart=true){
  if(!loaded)return;
  const token=++generation;
  if(restart)film.currentTime=start(current)+0.5/fps;
  started=true;$('error').hidden=true;state='playing';sync();
  try{await film.play();if(token===generation)watch(token)}catch(e){if(token===generation){state='paused';sync();$('error').hidden=false;$('error').textContent=`Playback could not start: ${e.message}. Press P to retry.`}}
}
function next(){if(!loaded)return;if(!started&&!document.fullscreenElement)fullscreen();if(state!=='ready'){if(current===all.length-1)return;current++}run()}
function pause(){if(state==='playing'){generation++;film.pause();state='paused';sync()}else if(state==='paused')run(false)}
function fullscreen(){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else if($('app').requestFullscreen)$('app').requestFullscreen().catch(()=>{})}
function speed(delta){film.playbackRate=Math.max(.25,Math.min(4,Math.round((film.playbackRate+delta)*4)/4));sync()}
function openPresenter(){
  presenter=window.open('','networks-presenter','width=900,height=760');
  if(!presenter){$('status').textContent='Allow the presenter popup to read the script.';return}
  const d=presenter.document;d.title='Presenter notes — '+deck.title;d.body.replaceChildren();
  const style=d.createElement('style');style.textContent='body{background:#07111f;color:#edf4ff;font:22px/1.65 system-ui;padding:24px}h1{font-size:24px;color:#64d8eb}video{width:100%;max-height:230px;object-fit:contain}p{white-space:pre-wrap}button,select{padding:12px;margin:4px;background:#17334b;color:white;border:1px solid #456;border-radius:8px;font-size:18px}small{color:#9bb3ce}';d.head.append(style);
  const h=d.createElement('h1');h.id='section';d.body.append(h);
  const v=d.createElement('video');v.id='preview';v.src=film.currentSrc||film.src;v.muted=true;d.body.append(v);
  const n=d.createElement('p');n.id='script';d.body.append(n);
  const rate=d.createElement('p');rate.id='speed';d.body.append(rate);
  for(const [text,action] of [['← Previous',()=>choose(current-1)],['Replay',()=>run()],['Pause / Resume',pause],['Next →',next],['Slower ↓',()=>speed(-.25)],['Faster ↑',()=>speed(.25)]]){const b=d.createElement('button');b.textContent=text;b.onclick=action;d.body.append(b)}
  const select=d.createElement('select');select.id='scenes';select.setAttribute('aria-label','Choose scene');
  all.forEach((s,i)=>{const o=d.createElement('option');o.value=i;o.textContent=`${i+1}. ${s.name}`;select.append(o)});
  select.onchange=()=>choose(Number(select.value));d.body.append(select);
  const up=d.createElement('p');up.id='upnext';d.body.append(up);
  const small=d.createElement('small');small.textContent='Main window: video only. → next · ← previous · ↑/↓ speed (0.25× to 4×) · P pause · R replay · F fullscreen · C captions. Speed also appears in the main browser tab title.';d.body.append(small);
  d.addEventListener('keydown',key);v.addEventListener('loadedmetadata',sync,{once:true});sync();
}
function key(e){
  if(e.repeat||['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName))return;
  if(e.target.tagName==='BUTTON'&&[' ','Enter'].includes(e.key))return;
  if(e.shiftKey&&e.key.toLowerCase()==='p'){e.preventDefault();openPresenter();return}
  const actions={' ':next,Enter:next,ArrowRight:next,PageDown:next,ArrowLeft:()=>choose(current-1),PageUp:()=>choose(current-1),ArrowUp:()=>speed(.25),ArrowDown:()=>speed(-.25),r:()=>run(),p:pause,f:fullscreen,c:()=>{track.mode=track.mode==='showing'?'hidden':'showing'},Home:()=>choose(0),End:()=>choose(all.length-1)};
  const action=actions[e.key]||actions[e.key.toLowerCase()];if(action){e.preventDefault();action()}
}
film.onclick=next;
film.addEventListener('loadeddata',()=>{loaded=true;choose(0)},{once:true});
film.addEventListener('timeupdate',()=>check(film.currentTime));film.addEventListener('ended',hold);
film.addEventListener('ratechange',sync);
film.addEventListener('error',()=>{$('error').hidden=false;$('error').textContent='Cannot load episode.mp4. Keep it beside presentation.html, or open this lesson using the local server link in the README.'});
document.addEventListener('keydown',key);sync();
window.lessonState=()=>({current,state,loaded,time:film.currentTime,start:start(current),end:finish(current),motionEnd:motionFinish(current),count:all.length,speed:film.playbackRate});
</script></body></html>
